name: issue-35-resume-20261015
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact public Git objects, never credentials or runner state
        shell: bash
        run: |
          set -euo pipefail
          saved=d8fee1718dbeb30716df4e4e4129656441fff05a
          test "$(git rev-parse HEAD^)" = "$saved"
          test "$(git rev-parse "$saved^{tree}")" = f33339a1df6ec6e0373b053403b73016edf8b79d
          out="$RUNNER_TEMP/issue35-resume-20261015"
          mkdir -p "$out"
          git update-ref refs/recovery/issue35-resume HEAD
          git bundle create "$out/history.bundle" refs/recovery/issue35-resume
          printf '%s\n' "$saved" > "$out/saved-head.txt"
          git rev-parse HEAD > "$out/transport-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/transport-tree.txt"
          git rev-parse origin/main > "$out/main-head.txt"
          git bundle verify "$out/history.bundle"
          (cd "$out"; sha256sum history.bundle ./*.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-resume-20261015-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-resume-20261015/
          retention-days: 14
          if-no-files-found: error

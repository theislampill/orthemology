    from: osm_learning_trajectory
    to: restoration
    contribution: Longitudinal traces and interventions can distinguish pathways hidden by terminal labels.
    nontransfer: Task learning and representational adaptation are not human or noetic restoration.
  - edge_id: OSM-FW-05
    from: osm_learning_trajectory
    to: tensor_search
    contribution: Architecture, objective, and trajectory comparison sharpen held-out rival-model protocols.
    nontransfer: A winner among tested settings is not a universal mechanism or ontology result.
research_queue:
  - id: OSM-RQ-01
    question: Is endpoint-versus-trajectory discrimination an exact instance of the result-versus-pathway architecture, a guarded specialization, or only an analogy?
    required_output: FORMAL_CORRESPONDENCE_OR_EXPLICIT_NONIDENTITY
  - id: OSM-RQ-02
    question: Which trace quotient preserves the distinctions needed to discriminate candidate update mechanisms without identifying latent labels?
    required_output: TYPED_DEFINITION_PROOF_OR_COUNTERMODEL
  - id: OSM-RQ-03
    question: What intervention or observation sequence minimally separates candidate latent-transition models that agree at the endpoint?
    required_output: BOUNDED_QUERY_COMPLEXITY_OR_IMPOSSIBILITY_RESULT
  - id: OSM-RQ-04
    question: Which guards permit transport across altered cues or track geometry without silently equating states, representations, or applicability?
    required_output: GUARDED_TRANSPORT_RESULT_WITH_DELETION_MODELS
  - id: OSM-RQ-05
    question: Can one trace-sensitive invariant apply to learning, proof audits, reason transport, and restoration without collapsing their distinct success predicates?
    required_output: CROSS_DOMAIN_REDUCTION_SHARED_INVARIANT_OR_BOUNDARY_THEOREM

name: issue-35-recovery-04

# Temporary read-only public Git transport. No checkout configuration, token,
# runner environment, cache or private input is exported. Remove before sealing.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact public history without repository configuration
        shell: bash
        run: |
          set -euo pipefail
          target=2a55c3ab60bae8e8161b80ab3ea78cdfab945412
          main=0784acddd4770f1190f758f264ba52b2b110bd27
          test "$(git rev-parse HEAD^)" = "$target"
          test "$(git rev-parse "$target^{tree}")" = 56a1390d1887eaf0a0d8951b105c5540c006f19c
          test "$(git rev-parse "$main^{tree}")" = 38b18f38db2e38dabe1ec391c07c0b0f2b20d574
          out="$RUNNER_TEMP/issue35-recovery04"
          mkdir -p "$out"
          git update-ref refs/recovery/issue35 "$target"
          git update-ref refs/recovery/main "$main"
          git bundle create "$out/public-history.bundle" refs/recovery/issue35 refs/recovery/main
          git bundle verify "$out/public-history.bundle"
          git cat-file commit "$GITHUB_SHA" > "$out/transport-commit.txt"
          git rev-parse HEAD > "$out/transport-head.txt"
          git rev-parse "$target^{tree}" > "$out/target-tree.txt"
          printf '%s\n' "$target" > "$out/target-head.txt"
          printf '%s\n' "$main" > "$out/main-head.txt"
          (cd "$out"; sha256sum public-history.bundle transport-commit.txt transport-head.txt target-tree.txt target-head.txt main-head.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-recovery04-public-history
          path: ${{ runner.temp }}/issue35-recovery04/
          retention-days: 14
          if-no-files-found: error

name: issue-35-recovery-05

# Temporary read-only transport for the already authorised Issue 35 branch.
# Export public Git objects only; remove before the next qualified checkpoint.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export incremental public history over the preserved recovery bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 32440aad4db897be5b8ef2fb7086a6f7a87f4cd4
          test "$(git rev-parse 'HEAD^^{tree}')" = 1f1e0873752ae9125fb5cfd22d7632e61f1b0806
          base=2a55c3ab60bae8e8161b80ab3ea78cdfab945412
          git merge-base --is-ancestor "$base" HEAD
          out="$RUNNER_TEMP/issue35-recovery05"
          mkdir -p "$out"
          git update-ref refs/heads/issue35-public-recovery "$GITHUB_SHA"
          git bundle create "$out/increment.bundle" refs/heads/issue35-public-recovery "^$base"
          git rev-parse HEAD > "$out/transport-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/transport-tree.txt"
          git rev-parse HEAD^ > "$out/saved-head.txt"
          git rev-parse origin/main > "$out/main-head.txt"
          (cd "$out"; sha256sum increment.bundle transport-head.txt transport-tree.txt saved-head.txt main-head.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-recovery05-public-increment
          path: ${{ runner.temp }}/issue35-recovery05/
          retention-days: 14
          if-no-files-found: error

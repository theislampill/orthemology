name: issue-35-composition-progress-checkpoint
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue35-composition-progress
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact source-bound composition and progress patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = fc8848bba6d81d326506bbde072f999a9ef1057b
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 0784acddd4770f1190f758f264ba52b2b110bd27
          test -z "$(git status --porcelain)"
          export EVIDENCE_DIR="$RUNNER_TEMP/issue35-composition-progress"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python - <<'PY_APPLY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          import yaml
          out = Path(os.environ['EVIDENCE_DIR'])
          before_authored = yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']
          payload = ''
          packed = base64.b64decode(payload, validate=True)
          if len(packed) != 16480 or hashlib.sha256(packed).hexdigest() != '162b5b26824a9ff887bf9a00fc2fbaf62cbb79d170dd87f0defc80155af6f934':
              raise SystemExit('Compressed patch identity mismatch')
          patch = lzma.decompress(packed)
          if len(patch) != 56160 or hashlib.sha256(patch).hexdigest() != '89d941f725fcd408adfb41182c7ecff9b3fc7f60ce7cc4e0a7efdbde7b2e45d1':
              raise SystemExit('Authored patch identity mismatch')
          (out/'authored.patch').write_bytes(patch)
          # The first mutable progress snapshot is retained in Git history.
          # Remove only that own new file and this helper to reach the exact
          # pre-increment tree against which the reviewed patch was tested.
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml',
              'docs/project-closure/reader-refactor-issue-35/PROGRESS.md'],check=True)
          if subprocess.check_output(['git','write-tree']).decode().strip() != '631ad6f8983449502619a87594587a0cb3fe1ef6':
              raise SystemExit('Pre-increment content tree mismatch')
          subprocess.run(['git','apply','--index','--binary',str(out/'authored.patch')],check=True)
          allowed = set(['docs/project-closure/reader-refactor-issue-35/CROSSWALK.json', 'docs/project-closure/reader-refactor-issue-35/EXECUTION.md', 'docs/project-closure/reader-refactor-issue-35/PROGRESS.md', 'docs/reader/APPLICATIONS.md', 'docs/reader/CURRENT-FRONTIERS.md', 'docs/reader/PAPER-CATALOGUE.md', 'docs/reader/RESEARCH-ATLAS.md', 'docs/reader/RESULT-INDEX.md', 'docs/reader/VERIFICATION-GUIDE.md', 'tests/test_reader_pilot.py'])
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only','1b9109f72a8548c2d60226635b5f1134101fc355']).decode().splitlines())
          if actual != allowed:
              raise SystemExit('Unexpected authored paths: '+repr(sorted(actual)))
          subprocess.run(['python','-B','scripts/generate_current_state.py'],check=True)
          subprocess.run(['python','-B','scripts/make_manifest.py'],check=True)
          if yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored'] != before_authored:
              raise SystemExit('Authored project state changed')
          subprocess.run(['git','add','--','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'],check=True)
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only','1b9109f72a8548c2d60226635b5f1134101fc355']).decode().splitlines())
          if actual != allowed | {'docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'}:
              raise SystemExit('Unexpected final write set')
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          (out/'tree.txt').write_text(tree+'\n')
          if tree != '327fbe8f92740a5f7879dca15e5298024266dc5f':
              raise SystemExit('Candidate differs from exact locally tested tree: '+tree)
          subprocess.run(['git','diff','--exit-code'],check=True)
          print('PASS: exact ten authored paths plus existing generated owners; protected science unchanged')
          PY_APPLY
      - name: Qualify the exact curation without claiming scientific replay
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-normal.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-normal.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/actual-reader.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/t20-projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/state-drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/current-state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/internal-references.txt"
      - name: Publish only the exact checked feature tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 327fbe8f92740a5f7879dca15e5298024266dc5f
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: deepen composition and revision works with counted refactor progress'
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/committed-state.txt"
          test "$(git rev-parse HEAD^{tree})" = 327fbe8f92740a5f7879dca15e5298024266dc5f
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          printf '%s\n' 1b9109f72a8548c2d60226635b5f1134101fc355 > "$EVIDENCE_DIR/predecessor.txt"
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" HEAD ^1b9109f72a8548c2d60226635b5f1134101fc355
          git bundle verify "$EVIDENCE_DIR/checkpoint.bundle" > "$EVIDENCE_DIR/bundle-verify.txt" 2>&1
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Retain observed evidence, not independent acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-composition-progress-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-composition-progress/
          retention-days: 14
          if-no-files-found: error

schema: ar8r-tac-sac-typed-coordinate-and-countermodel-registry-v11
source_class: NEW_V11
registry_status: BOUNDED_ANALYTIC_COMPARATOR
historical_packet_status: UNAVAILABLE
historical_identity_assignment: NONE
unavailable_exact_terms:
  - TAC
  - SAC
  - orthemologous
  - paralemologous
  - SAC-T4
  - CC-T4
  - M11-M13
  - TAC-IDENTITY-FAMILY
  - exact occurrence-meaning definition
historical_firewall:
  coordinate_semantics: NEW_V11_ONLY_NOT_RECOVERED_HISTORICAL_DEFINITIONS
  acronym_expansion: UNASSIGNED
  tachikoma_identity_verdict: NOT_ESTABLISHED
  tac_sac_term_adoption: NOT_AUTHORIZED
  exact_source_status: EXACT_TAC_SAC_PACKET_UNAVAILABLE
  registry_rule: Finite witnesses show only that the stated implication is not forced by the declared NEW_V11 coordinates.
  metaphysical_adequacy: NOT_CLAIMED
source_status:
  public_program_owner: tac-sac-identity-and-independence.md
  compatibility_index: full-program-reentry-v2-source/AR8R_TAC_TACHIKOMA_STATUS_V1.md
  expanded_owner_names:
    - AR8R_TAC_TACHIKOMA_SAC_CONTINUITY_V1.md
    - AR8R_TAC_TACHIKOMA_SAC_CONTINUITY_V1.yaml
  expanded_owner_custody: PRESERVED_RECOVERY_SOURCE_NOT_REPUBLISHED_HERE
coordinate_contract:
  closed_world: true
  reference_rule: Every coordinate reference in this file must resolve to one coordinate_registry id.
  projection_rule: Every coordinate declares at least one typed projection with domain, codomain, and rule.
  collapse_rule: forbidden_collapses names coordinates that cannot be identified without an additional bridge.
coordinate_registry:
  - id: registered_type
    domain: finite model entities
    value_space: finite registered-type labels
    equality_criterion: Two entities agree exactly when their declared registered-type labels are equal.
    relevant_projections: [{id: entity_to_registered_type, domain: finite model entities, codomain: registered_type, rule: Return the declared type label.}]
    forbidden_collapses: [numerical_identity, episode_occurrence, lineage_root]
  - id: numerical_identity
    domain: finite model entities
    value_space: equivalence classes of entities
    equality_criterion: Two entity names are numerically identical exactly when they lie in the same declared identity class.
    relevant_projections: [{id: entity_to_identity_class, domain: finite model entities, codomain: numerical_identity, rule: Return the entity identity class.}]
    forbidden_collapses: [registered_type, state_profile, function_profile, lineage_root, coherent_lineage_transport]
  - id: state_profile
    domain: entity-time or entity-horizon pairs
    value_space: finite state vectors
    equality_criterion: Profiles agree exactly when every declared state coordinate has the same value on the declared horizon.
    relevant_projections: [{id: entity_horizon_to_state_profile, domain: entity-time or entity-horizon pairs, codomain: state_profile, rule: Return the declared state vector.}]
    forbidden_collapses: [numerical_identity, carrier, episode_occurrence]
  - id: function_profile
    domain: entities on a finite input domain
    value_space: finite input-output maps
    equality_criterion: Functions agree exactly when their outputs agree on every input in the declared finite domain.
    relevant_projections: [{id: entity_to_function_profile, domain: entities on a finite input domain, codomain: function_profile, rule: Return the finite input-output graph.}]
    forbidden_collapses: [numerical_identity, proper_function, mentality]
  - id: output_value
    domain: episode-input pairs
    value_space: finite output symbols
    equality_criterion: Outputs agree exactly when their declared symbols are equal.
    relevant_projections: [{id: episode_input_to_output, domain: episode-input pairs, codomain: output_value, rule: Return the emitted symbol.}]
    forbidden_collapses: [episode_occurrence, carrier, warrant]
  - id: episode_occurrence
    domain: finite event tokens
    value_space: event identity labels
    equality_criterion: Occurrences agree exactly when they use the same declared event token.
    relevant_projections: [{id: event_to_episode_token, domain: finite event tokens, codomain: episode_occurrence, rule: Return the event token.}]
    forbidden_collapses: [carrier, output_value, state_profile]
  - id: carrier
    domain: entities or event tokens
    value_space: finite physical or logical bearer labels
    equality_criterion: Carriers agree exactly when the bearer label is equal.
    relevant_projections: [{id: entity_or_event_to_carrier, domain: entities or event tokens, codomain: carrier, rule: Return the declared bearer label or bearer set.}]
    forbidden_collapses: [episode_occurrence, numerical_identity, common_bearer]
  - id: lineage_root
    domain: entities, reports, or artifacts
    value_space: finite ancestry-root labels
    equality_criterion: Roots agree exactly when ancestry terminates at the same declared root label.
    relevant_projections: [{id: item_to_lineage_root, domain: entities reports or artifacts, codomain: lineage_root, rule: Follow the declared ancestry relation to its root.}]
    forbidden_collapses: [numerical_identity, evidential_independence, provenance_root]
  - id: coherent_lineage_transport
    domain: world-indexed fibres with edge maps
    value_space: finite coherent sections or false
    equality_criterion: Values agree exactly when the same anchor assignments satisfy every declared edge map.
    relevant_projections: [{id: bundle_to_coherent_section, domain: world-indexed fibres with edge maps, codomain: coherent_lineage_transport, rule: Return the anchor section when every edge map commutes.}]
    forbidden_collapses: [numerical_identity, necessary_being]
  - id: copy_relation
    domain: ordered pairs of artifacts or reports
    value_space: [copied, not_copied]
    equality_criterion: The value is copied exactly when the declared source-to-copy edge exists.
    relevant_projections: [{id: pair_to_copy_status, domain: ordered artifact or report pairs, codomain: copy_relation, rule: Test membership in the declared copy edges.}]
    forbidden_collapses: [provenance_root, evidential_independence]
  - id: provenance_root
    domain: artifacts, reports, or claims
    value_space: finite acquisition-root labels
    equality_criterion: Roots agree exactly when the declared acquisition graph reaches the same root token.
    relevant_projections: [{id: item_to_provenance_root, domain: artifacts reports or claims, codomain: provenance_root, rule: Follow acquisition edges to the first declared root.}]
    forbidden_collapses: [copy_count, receipt, path_label]
  - id: copy_count
    domain: finite copy families
    value_space: nonnegative integers
    equality_criterion: Counts agree exactly when family cardinalities agree.
    relevant_projections: [{id: copy_family_to_count, domain: finite copy families, codomain: copy_count, rule: Return the number of declared copies.}]
    forbidden_collapses: [evidential_independence, provenance_root]
  - id: evidential_independence
    domain: finite sets of reports or claims
    value_space: [independent, dependent]
    equality_criterion: Values agree exactly when the declared root-sharing criterion gives the same dependency result.
    relevant_projections: [{id: report_family_to_independence, domain: finite report families, codomain: evidential_independence, rule: Return independent only when no two selected reports share a declared acquisition root.}]
    forbidden_collapses: [copy_count, path_label, visible_profile, lineage_root]
  - id: path_label
    domain: reports, routes, or artifacts
    value_space: finite display labels
    equality_criterion: Labels agree exactly when their literal declared strings agree.
    relevant_projections: [{id: item_to_path_label, domain: reports routes or artifacts, codomain: path_label, rule: Return the display or route label.}]
    forbidden_collapses: [provenance_root, evidential_independence]
  - id: visible_profile
    domain: entities, reports, or artifacts
    value_space: finite observable-feature vectors
    equality_criterion: Profiles agree exactly when every declared visible feature agrees.
    relevant_projections: [{id: item_to_visible_profile, domain: entities reports or artifacts, codomain: visible_profile, rule: Restrict the full valuation to declared visible features.}]
    forbidden_collapses: [lineage_root, evidential_independence, numerical_identity, mentality]
  - id: independent_convergence
    domain: finite producer families and a target output
    value_space: [converged_independently, not_independently_converged]
    equality_criterion: The value is converged_independently exactly when distinct declared roots produce the same target without copy edges.
    relevant_projections: [{id: producer_family_to_convergence, domain: producer families and target output, codomain: independent_convergence, rule: Check root distinction copy-edge absence and output equality.}]
    forbidden_collapses: [numerical_identity, evidential_independence, mentality]
  - id: receipt
    domain: message-event pairs
    value_space: [received, not_received]
    equality_criterion: Values agree exactly when the declared delivery relation contains the message-event pair.
    relevant_projections: [{id: message_event_to_receipt, domain: message-event pairs, codomain: receipt, rule: Test declared delivery.}]
    forbidden_collapses: [proposition_truth, warrant, applicability, adoption, common_knowledge]
  - id: proposition_truth
    domain: finite propositions in a valuation
    value_space: [true, false]
    equality_criterion: Values agree exactly when the declared valuation assigns the same Boolean value.
    relevant_projections: [{id: proposition_to_truth, domain: finite propositions, codomain: proposition_truth, rule: Return the declared Boolean valuation.}]
    forbidden_collapses: [receipt, authorization, warrant]
  - id: warrant
    domain: agent-claim pairs
    value_space: [warranted, unwarranted]
    equality_criterion: Values agree exactly when the declared evidence and rule set licenses the same claim for the agent.
    relevant_projections: [{id: agent_claim_to_warrant, domain: agent-claim pairs, codomain: warrant, rule: Apply the declared evidence-license relation.}]
    forbidden_collapses: [proposition_truth, receipt, authorization, reliable_success, proper_function]
  - id: applicability
    domain: artifact-target-version triples
    value_space: [applicable, inapplicable]
    equality_criterion: Values agree exactly when every declared target and version guard has the same result.
    relevant_projections: [{id: artifact_target_version_to_applicability, domain: artifact-target-version triples, codomain: applicability, rule: Evaluate the declared applicability guards.}]
    forbidden_collapses: [receipt, artifact_bytes, source_provenance]
  - id: adoption
    domain: actor-proposal pairs
    value_space: [adopted, not_adopted]
    equality_criterion: Values agree exactly when the declared owner-adoption relation has the same membership.
    relevant_projections: [{id: actor_proposal_to_adoption, domain: actor-proposal pairs, codomain: adoption, rule: Test the declared adoption relation.}]
    forbidden_collapses: [receipt, authorization, execution, writeback]
  - id: agreement
    domain: actor-content pairs
    value_space: [agrees, does_not_agree]
    equality_criterion: Values agree exactly when the declared assent relation has the same membership.
    relevant_projections: [{id: actor_content_to_agreement, domain: actor-content pairs, codomain: agreement, rule: Test declared assent.}]
    forbidden_collapses: [understanding, authorization, adoption]
  - id: understanding
    domain: actor-content pairs
    value_space: [understands, does_not_understand]
    equality_criterion: Values agree exactly when the declared comprehension relation has the same membership.
    relevant_projections: [{id: actor_content_to_understanding, domain: actor-content pairs, codomain: understanding, rule: Test declared comprehension.}]
    forbidden_collapses: [agreement, authorization, warrant]
  - id: authorization
    domain: actor-action-target triples
    value_space: [authorized, unauthorized]
    equality_criterion: Values agree exactly when the declared permission relation has the same membership.
    relevant_projections: [{id: actor_action_target_to_authorization, domain: actor-action-target triples, codomain: authorization, rule: Test declared permission.}]
    forbidden_collapses: [agreement, understanding, proposition_truth, warrant, execution]
  - id: execution
    domain: actor-action-event triples
    value_space: [executed, not_executed]
    equality_criterion: Values agree exactly when the declared event log contains the action event.
    relevant_projections: [{id: actor_action_event_to_execution, domain: actor-action-event triples, codomain: execution, rule: Test declared execution event.}]
    forbidden_collapses: [authorization, adoption, writeback]
  - id: writeback
    domain: action-state pairs
    value_space: [written_back, not_written_back]
    equality_criterion: Values agree exactly when the declared durable-state mutation exists.
    relevant_projections: [{id: action_state_to_writeback, domain: action-state pairs, codomain: writeback, rule: Test declared durable mutation.}]
    forbidden_collapses: [execution, adoption, receipt]
  - id: private_acknowledgment
    domain: ordered actor-message pairs
    value_space: [acknowledged_privately, not_acknowledged]
    equality_criterion: Values agree exactly when the declared private acknowledgment edge exists.
    relevant_projections: [{id: actor_message_to_private_ack, domain: ordered actor-message pairs, codomain: private_acknowledgment, rule: Test the private acknowledgment relation.}]
    forbidden_collapses: [common_knowledge, receipt]
  - id: common_knowledge
    domain: agent-group proposition pairs in a finite epistemic model
    value_space: [common_knowledge, not_common_knowledge]
    equality_criterion: The value is common_knowledge exactly when the proposition holds at every state reachable by any finite sequence of group accessibility edges.
    relevant_projections: [{id: group_proposition_to_common_knowledge, domain: group-proposition pairs in finite epistemic models, codomain: common_knowledge, rule: Evaluate reflexive-transitive group reachability.}]
    forbidden_collapses: [receipt, private_acknowledgment, agreement]
  - id: shared_vocabulary
    domain: pairs of language systems
    value_space: finite shared token sets
    equality_criterion: Values agree exactly when the intersections of declared token inventories agree.
    relevant_projections: [{id: language_pair_to_shared_vocabulary, domain: pairs of language systems, codomain: shared_vocabulary, rule: Return token-set intersection.}]
    forbidden_collapses: [shared_schema, full_local_grammar, occurrence_meaning]
  - id: shared_schema
    domain: pairs of representation systems
    value_space: finite shared field-and-type signatures
    equality_criterion: Values agree exactly when the declared common signatures agree.
    relevant_projections: [{id: system_pair_to_shared_schema, domain: pairs of representation systems, codomain: shared_schema, rule: Return the common declared signature.}]
    forbidden_collapses: [full_local_grammar, occurrence_meaning, causal_lineage]
  - id: full_local_grammar
    domain: language-system and context pairs
    value_space: finite grammar-rule sets
    equality_criterion: Grammars agree exactly when every declared local rule agrees.
    relevant_projections: [{id: system_context_to_full_grammar, domain: language-system and context pairs, codomain: full_local_grammar, rule: Return all declared local rules.}]
    forbidden_collapses: [grammar_kernel, shared_vocabulary, shared_schema]
  - id: occurrence_meaning
    domain: token-occurrence and context pairs
    value_space: finite semantic labels
    equality_criterion: Meanings agree exactly when the declared context-sensitive semantic labels agree.
    relevant_projections: [{id: token_context_to_occurrence_meaning, domain: token-occurrence and context pairs, codomain: occurrence_meaning, rule: Return the declared occurrence label.}]
    forbidden_collapses: [token_type, shared_vocabulary, translation_query_preservation]
  - id: causal_lineage
    domain: artifacts, representations, or systems
    value_space: finite causal-root labels
    equality_criterion: Lineages agree exactly when the declared causal graph reaches the same root.
    relevant_projections: [{id: item_to_causal_lineage, domain: artifacts representations or systems, codomain: causal_lineage, rule: Follow declared causal edges to a root.}]
    forbidden_collapses: [shared_schema, visible_profile, independent_convergence]
  - id: grammar_kernel
    domain: language or representation systems
    value_space: finite selected grammar-rule subsets
    equality_criterion: Kernels agree exactly when every selected kernel rule agrees.
    relevant_projections: [{id: system_to_grammar_kernel, domain: language or representation systems, codomain: grammar_kernel, rule: Restrict the full grammar to registered kernel rules.}]
    forbidden_collapses: [full_local_grammar, carrier, referent, mentality, agency]
  - id: referent
    domain: expression-occurrence pairs
    value_space: finite object labels plus none
    equality_criterion: Referents agree exactly when the declared denotation labels agree.
    relevant_projections: [{id: expression_occurrence_to_referent, domain: expression-occurrence pairs, codomain: referent, rule: Return the declared denotation.}]
    forbidden_collapses: [occurrence_meaning, grammar_kernel, mentality]
  - id: mentality
    domain: entities
    value_space: [mental, nonmental, unassigned]
    equality_criterion: Values agree exactly when the declared model valuation agrees.
    relevant_projections: [{id: entity_to_mentality, domain: entities, codomain: mentality, rule: Return the declared bounded model valuation.}]
    forbidden_collapses: [function_profile, articulability, convergence, grammar_kernel, speech_capacity]
  - id: agency
    domain: entities
    value_space: [agent, nonagent, unassigned]
    equality_criterion: Values agree exactly when the declared model valuation agrees.
    relevant_projections: [{id: entity_to_agency, domain: entities, codomain: agency, rule: Return the declared bounded model valuation.}]
    forbidden_collapses: [function_profile, grammar_kernel, authorization]
  - id: translation_query_preservation
    domain: translation-map and query pairs
    value_space: [preserved, not_preserved]
    equality_criterion: The value is preserved exactly when the query value is constant on every attained translation fibre.
    relevant_projections: [{id: translation_query_to_preservation, domain: translation-map and query pairs, codomain: translation_query_preservation, rule: Compare query values within each attained fibre.}]
    forbidden_collapses: [full_semantic_preservation, full_grammatical_preservation, occurrence_meaning]
  - id: full_semantic_preservation
    domain: translation maps
    value_space: [fully_preserved, not_fully_preserved]
    equality_criterion: The value is fully_preserved exactly when every declared semantic feature is invariant and recoverable.
    relevant_projections: [{id: translation_to_semantic_preservation, domain: translation maps, codomain: full_semantic_preservation, rule: Check all declared semantic features.}]
    forbidden_collapses: [translation_query_preservation, translation_truth]
  - id: full_grammatical_preservation
    domain: translation maps
    value_space: [fully_preserved, not_fully_preserved]
    equality_criterion: The value is fully_preserved exactly when every declared grammatical feature is invariant and recoverable.
    relevant_projections: [{id: translation_to_grammatical_preservation, domain: translation maps, codomain: full_grammatical_preservation, rule: Check all declared grammatical features.}]
    forbidden_collapses: [translation_query_preservation, full_semantic_preservation]
  - id: token_type
    domain: token occurrences
    value_space: finite lexical type labels
    equality_criterion: Types agree exactly when their declared lexical labels agree.
    relevant_projections: [{id: occurrence_to_token_type, domain: token occurrences, codomain: token_type, rule: Return the declared lexical type.}]
    forbidden_collapses: [occurrence_meaning, referent, full_local_grammar]
  - id: source_provenance
    domain: source or artifact tokens
    value_space: finite source-chain records
    equality_criterion: Provenance agrees exactly when every declared source-chain edge and root agree.
    relevant_projections: [{id: item_to_source_provenance, domain: source or artifact tokens, codomain: source_provenance, rule: Return the declared source chain.}]
    forbidden_collapses: [translation_truth, warrant, applicability]
  - id: translation_truth
    domain: translated proposition tokens
    value_space: [true, false, unassigned]
    equality_criterion: Values agree exactly when the declared target-language proposition valuation agrees.
    relevant_projections: [{id: translated_proposition_to_truth, domain: translated proposition tokens, codomain: translation_truth, rule: Return the declared bounded valuation.}]
    forbidden_collapses: [source_provenance, translation_query_preservation]
  - id: artifact_bytes
    domain: artifact-version tokens
    value_space: finite byte strings
    equality_criterion: Byte values agree exactly when the byte strings are identical.
    relevant_projections: [{id: artifact_version_to_bytes, domain: artifact-version tokens, codomain: artifact_bytes, rule: Return the declared byte string.}]
    forbidden_collapses: [version_eligibility, applicability, source_provenance]
  - id: version_eligibility
    domain: artifact-version-target triples
    value_space: [eligible, ineligible]
    equality_criterion: Values agree exactly when all declared version, target, authority, and invalidator guards agree.
    relevant_projections: [{id: artifact_version_target_to_eligibility, domain: artifact-version-target triples, codomain: version_eligibility, rule: Evaluate declared eligibility guards.}]
    forbidden_collapses: [artifact_bytes, visible_profile, receipt]
  - id: proof_skeleton
    domain: theorem-proof records
    value_space: finite rule-graph isomorphism classes
    equality_criterion: Skeletons agree exactly when their declared inference-rule graphs are isomorphic under typed renaming.
    relevant_projections: [{id: proof_to_skeleton, domain: theorem-proof records, codomain: proof_skeleton, rule: Erase theorem labels and retain the typed inference-rule graph.}]
    forbidden_collapses: [theorem_identity, origin_credit, novelty_credit]
  - id: theorem_identity
    domain: theorem records
    value_space: unique theorem identifiers
    equality_criterion: Identities agree exactly when the declared theorem identifier is identical.
    relevant_projections: [{id: theorem_record_to_identity, domain: theorem records, codomain: theorem_identity, rule: Return the declared identifier.}]
    forbidden_collapses: [proof_skeleton, origin_credit, novelty_credit]
  - id: origin_credit
    domain: theorem records
    value_space: finite origin-owner labels or zero
    equality_criterion: Credits agree exactly when the declared ancestry owner agrees.
    relevant_projections: [{id: theorem_to_origin_credit, domain: theorem records, codomain: origin_credit, rule: Return the declared ancestry owner or zero.}]
    forbidden_collapses: [proof_skeleton, theorem_identity, novelty_credit]
  - id: novelty_credit
    domain: theorem records
    value_space: nonnegative bounded novelty levels
    equality_criterion: Credits agree exactly when the declared novelty level agrees.
    relevant_projections: [{id: theorem_to_novelty_credit, domain: theorem records, codomain: novelty_credit, rule: Return the declared bounded novelty level.}]
    forbidden_collapses: [proof_skeleton, theorem_identity, origin_credit]
  - id: distributed_realization
    domain: role-carrier structures
    value_space: finite assignments from roles to carrier sets
    equality_criterion: Realizations agree exactly when every role has the same declared carrier set.
    relevant_projections: [{id: structure_to_distributed_realization, domain: role-carrier structures, codomain: distributed_realization, rule: Return each role carrier set.}]
    forbidden_collapses: [common_bearer, composite_attribution, numerical_identity]
  - id: common_bearer
    domain: finite role sets in a role-carrier structure
    value_space: carrier labels plus none
    equality_criterion: Values agree exactly when the intersection of all declared role-carrier sets has the same unique member or is empty.
    relevant_projections: [{id: role_set_to_common_bearer, domain: finite role sets, codomain: common_bearer, rule: Intersect the declared carrier sets.}]
    forbidden_collapses: [distributed_realization, coordinated_realization]
  - id: coordinated_realization
    domain: role-carrier structures
    value_space: [coordinated, uncoordinated]
    equality_criterion: Values agree exactly when the declared coordination relation has the same value.
    relevant_projections: [{id: structure_to_coordination, domain: role-carrier structures, codomain: coordinated_realization, rule: Test the declared coordination relation.}]
    forbidden_collapses: [common_bearer, composite_attribution]
  - id: composite_attribution
    domain: bearer and role-set pairs
    value_space: [licensed, unlicensed]
    equality_criterion: Values agree exactly when one bearer satisfies every declared role and attribution guard.
    relevant_projections: [{id: bearer_roles_to_composite_attribution, domain: bearer and role-set pairs, codomain: composite_attribution, rule: Check co-instantiation and declared licensing guards.}]
    forbidden_collapses: [distributed_realization, coordinated_realization]
  - id: reliable_success
    domain: system-trial families
    value_space: rational success rates in the declared finite trial set
    equality_criterion: Values agree exactly when successful-trial counts and trial counts agree.
    relevant_projections: [{id: trials_to_success_rate, domain: system-trial families, codomain: reliable_success, rule: Return successes divided by declared trials.}]
    forbidden_collapses: [proper_function, warrant]
  - id: proper_function
    domain: systems under a declared design or norm owner
    value_space: [properly_functioning, not_properly_functioning, unassigned]
    equality_criterion: Values agree exactly when the declared design-or-norm relation agrees.
    relevant_projections: [{id: system_to_proper_function, domain: systems under a design or norm owner, codomain: proper_function, rule: Return the declared design-or-norm status.}]

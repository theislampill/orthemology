name: issue-35-primary-works-checkpoint
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-primary-works-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact source-bound primary-work curation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d33105498ad83a9b622737b426563158ccb15d6d
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 0784acddd4770f1190f758f264ba52b2b110bd27
          test -z "$(git status --porcelain)"
          export EVIDENCE_DIR="$RUNNER_TEMP/issue35-primary-works"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python - <<'PY_APPLY'
          import base64,hashlib,lzma,os,subprocess
          from pathlib import Path
          import yaml
          out=Path(os.environ['EVIDENCE_DIR'])
          payload="""
          
          
          """
          packed=base64.b64decode(''.join(payload.split()),validate=True)
          if len(packed)!=15060 or hashlib.sha256(packed).hexdigest()!='39a03b942fb55cc23a08151412f0998c5e50c14f3edc5073397b90b2cdf1d490':
              raise SystemExit('Compressed patch identity mismatch')
          patch=lzma.decompress(packed)
          if len(patch)!=54774 or hashlib.sha256(patch).hexdigest()!='1274eadfd2122fc7eb60553fa47418034d138c580b319c895fde3d9395eaa1bd':
              raise SystemExit('Authored patch identity mismatch')
          (out/'authored.patch').write_bytes(patch)
          state=Path('docs/current-state.yaml')
          authored=yaml.safe_load(state.read_text())['authored']
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero',str(out/'authored.patch')],check=True)
          allowed={'docs/reader/RESEARCH-ATLAS.md','docs/reader/VERIFICATION-GUIDE.md','tests/test_reader_pilot.py','docs/project-closure/reader-refactor-issue-35/CROSSWALK.json','docs/reader/CURRENT-FRONTIERS.md','docs/project-closure/reader-refactor-issue-35/PRIMARY-WORK-COVERAGE.md','docs/reader/PAPER-CATALOGUE.md','docs/reader/APPLICATIONS.md','docs/reader/RESULT-INDEX.md'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','d33105498ad83a9b622737b426563158ccb15d6d']).decode().splitlines())
          if actual!=allowed:
              raise SystemExit('Unexpected authored write set: '+repr(sorted(actual)))
          subprocess.run(['python','-B','scripts/generate_current_state.py'],check=True)
          if yaml.safe_load(state.read_text())['authored']!=authored:
              raise SystemExit('Authored state was changed')
          subprocess.run(['python','-B','scripts/make_manifest.py'],check=True)
          subprocess.run(['git','add','--','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'],check=True)
          observed=subprocess.check_output(['git','write-tree']).decode().strip()
          (out/'observed-tree.txt').write_text(observed+'\n')
          if observed!='631ad6f8983449502619a87594587a0cb3fe1ef6':
              raise SystemExit('Reproduced tree differs from the local tested tree: '+observed)
          subprocess.run(['git','diff','--exit-code'],check=True)
          print('PASS: exact nine-file primary-work curation; authored state and scientific sources preserved')
          PY_APPLY
      - name: Qualify source, work and reader routes without scientific reclassification
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-normal.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-optimized.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-normal.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/t20-projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/state-drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/current-state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/internal-references.txt"
      - name: Publish only the exact checked feature tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 631ad6f8983449502619a87594587a0cb3fe1ef6
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: publish source-bound primary-manuscript and companion reading routes'
          test "$(git rev-parse HEAD^{tree})" = 631ad6f8983449502619a87594587a0cb3fe1ef6
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/committed-state.txt"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/tree.txt"
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" HEAD ^da65c9bee2802e25309d2f6644616ad789f88548
          git bundle verify "$EVIDENCE_DIR/checkpoint.bundle" 2>&1 | tee "$EVIDENCE_DIR/bundle-verification.txt"
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Retain observed checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-primary-works-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-primary-works/
          retention-days: 14
          if-no-files-found: error

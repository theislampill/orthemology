name: issue-35-resume-seventeenth
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact public Git history only
        shell: bash
        run: |
          set -euo pipefail
          saved=10d96790b1f9c4de17bafe672f9d0a27291c397b
          prior=e9050c1213753a7fd272c4c2d1b8e5579f51ce70
          main=0784acddd4770f1190f758f264ba52b2b110bd27
          test "$(git rev-parse HEAD^)" = "$saved"
          test "$(git rev-parse "$saved^{tree}")" = 2fd413585bdf5998c0afcb67000d06b3ab42961c
          git merge-base --is-ancestor "$prior" "$saved"
          out="$RUNNER_TEMP/issue35-resume-seventeenth"
          mkdir -p "$out"
          git update-ref refs/recovery/issue35-resume HEAD
          git bundle create "$out/history.bundle" refs/recovery/issue35-resume "^$prior" "^$main"
          printf '%s\n' "$saved" > "$out/saved-head.txt"
          git rev-parse HEAD > "$out/transport-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/transport-tree.txt"
          git rev-parse origin/main > "$out/main-head.txt"
          (cd "$out"; sha256sum ./*.bundle ./*.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-resume-seventeenth-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-resume-seventeenth/
          retention-days: 14
          if-no-files-found: error

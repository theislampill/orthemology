name: issue-35-application-checkpoint

# Temporary owner-authorised transport of the exact locally tested editorial/test
# patch. Original sources remain unchanged. This helper removes itself.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-application-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact tested curation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 796179d145d54d9d03a445bfdc7ac9e7d31da1b5
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-application"
          printf 'EVIDENCE_DIR=%s/issue35-application\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'issue35-application'
          (out/'transfer.txt').write_text('Five-file author-prepared curation/test patch; original sources protected.\n')
          payload = '''
          
          '''
          packed = base64.b64decode(''.join(payload.split()), validate=True)
          if len(packed) != 14292 or hashlib.sha256(packed).hexdigest() != 'ea9aa80ebd7418d75a2ecfef9f25920a308c88b256b86b47ffc02a47d3d64929':
              raise SystemExit('Compressed patch identity mismatch')
          patch = lzma.decompress(packed)
          if len(patch) != 71189 or hashlib.sha256(patch).hexdigest() != 'd1d440f05dcd27fe226620bbada417411974b95b65b4aafbeeea6a936fc8c2fe':
              raise SystemExit('Patch identity mismatch')
          p = out/'authored.patch'
          p.write_bytes(patch)
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero',str(p)],check=True)
          allowed = {
              'docs/project-closure/reader-refactor-issue-35/APPLICATION-COVERAGE.md',
              'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json',
              'docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json',
              'docs/reader/PAPER-CATALOGUE.md',
              'tests/test_reader_pilot.py',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only','796179d145d54d9d03a445bfdc7ac9e7d31da1b5']).decode().splitlines())
          if actual != allowed:
              raise SystemExit('Unexpected authored write set: '+repr(sorted(actual)))
          print('PASS: exact five-file source-read curation patch')
          PY
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = e052d1e611fe61f032416407a925f1fb0d54deda
          git diff --exit-code
      - name: Qualify the exact curation tree
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-tests.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-tests-opt.txt"
          python -B scripts/check_reader_pilot.py | tee "$EVIDENCE_DIR/reader-bindings.txt"
          python -B scripts/validate_t20_v6_projection.py | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_repo.py | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_review_state.py | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py | tee "$EVIDENCE_DIR/references.txt"
          for validator in validate_daee_crosswalk validate_noetic_application validate_daee_current_crosswalk validate_noetic_targets validate_noetic_claims validate_meta_noetic_memetics validate_memetic_ecology validate_corrective_transition validate_semantic_operator_contract validate_dynamic_orthing validate_somnic_orthing; do
            python -B "scripts/$validator.py" 2>&1 | tee "$EVIDENCE_DIR/$validator.txt"
          done
          git diff --cached --check
      - name: Save only the exact checked feature tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = e052d1e611fe61f032416407a925f1fb0d54deda
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: map the fifty-file application collection without paper or runtime inflation'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/tree.txt"
          git update-ref refs/heads/issue35-application-checkpoint HEAD
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" refs/heads/issue35-application-checkpoint ^fa2543b6ed4b9a295d41956defe8d68714b30b97
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed evidence without claiming full PR acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-application-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-application/
          retention-days: 14
          if-no-files-found: error

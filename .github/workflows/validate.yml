name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thin:
    name: Current corpus and thin candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
      - name: Install the exact original Python dependency lock
        run: |
          git show a7ff0e33d1a299db640041c46b1af81ca70851f6:requirements-ci.lock.txt > "$RUNNER_TEMP/requirements-ci.lock.txt"
          python -m pip install --quiet -r "$RUNNER_TEMP/requirements-ci.lock.txt"
      - name: Structural archive-lock schema
        run: python -c 'import json,jsonschema; schema=json.load(open("corpus/schema.json")); lock=json.load(open("corpus/archives.lock.json")); jsonschema.Draft202012Validator.check_schema(schema); jsonschema.Draft202012Validator(schema).validate(lock)'
      - name: Build verified local source packs from pinned Git objects
        run: python -B tools/rehydrate.py --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/source-cache" build-packs --dest "$RUNNER_TEMP/packs"
      - name: Assemble the actual approved 125-file candidate
        run: |
          python -B tools/rehydrate.py --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/packs" assemble --dest "$RUNNER_TEMP/thin" > "$RUNNER_TEMP/thin-assembly.json"
          python -c 'import json,os,pathlib; d=json.load(open(os.environ["RUNNER_TEMP"]+"/thin-assembly.json")); root=pathlib.Path(os.environ["RUNNER_TEMP"])/"thin"; files=[p for p in root.rglob("*") if p.is_file()]; assert d["files"]==125 and len(files)==125, (d,len(files)); assert not (root/".git").exists(); assert not (root/"research/t20-v6-20261012/sources").exists(); assert not (root/"experiments/orthemology-v5-successors/source-store").exists()'
      - name: All five current test families in the thin candidate
        env:
          ORTHEMOLOGY_CACHE: ${{ runner.temp }}/packs
          ORTHEMOLOGY_TEST_CACHE: ${{ runner.temp }}/packs
          ORTHEMOLOGY_TEST_ROOT: ${{ runner.temp }}/thin
        run: |
          cd "$RUNNER_TEMP/thin"
          python -B -m unittest discover -s tests -p test_integrity.py -v
          python -B -m unittest discover -s tests -p test_compatibility.py -v
          python -B -m unittest discover -s tests -p test_authority.py -v
          python -B -m unittest discover -s tests -p test_replay.py -v
          python -B -m unittest discover -s tests -p test_maintenance.py -v
      - name: Source-owned authority projection from archived inputs
        run: python -B "$RUNNER_TEMP/thin/tools/authority.py" --root "$RUNNER_TEMP/thin" --cache "$RUNNER_TEMP/packs" --offline validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thin-candidate-evidence
          path: ${{ runner.temp }}/thin-assembly.json
          retention-days: 14
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
      - name: Run all 71 original steps in the exact reconstructed source context
        run: |
          python -B tools/replay.py --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/source-cache" --history-from-git "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/legacy-validation" --keep-going --timeout 3600 ci all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-validation-evidence
          path: |
            ${{ runner.temp }}/legacy-validation/RUN.json
            ${{ runner.temp }}/legacy-validation/command-*.log
          retention-days: 14
  qualify:
    name: Exact representative replay (${{ matrix.case }})
    # One named push requests a qualification campaign; ordinary follow-up
    # pushes and duplicate PR events do not repeat expensive suites.
    # Scoped repair markers rerun only the affected Lean or publication family;
    # successful unchanged selections retain their explicitly scoped evidence.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[qualify-replay]') || contains(github.event.head_commit.message, '[qualify-lean]') || contains(github.event.head_commit.message, '[qualify-publication]') || contains(github.event.head_commit.message, '[qualify-fable]') || contains(github.event.head_commit.message, '[qualify-evidence]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(contains(github.event.head_commit.message, '[qualify-evidence]') && '["hidden-parity-pruning","json-certificate-reference","finite-foundation-controls","native-reference-and-formal"]' || contains(github.event.head_commit.message, '[qualify-fable]') && '["fibre-certification"]' || contains(github.event.head_commit.message, '[qualify-lean]') && '["family-computability","erased-certificate-work-boundary","hidden-parity-pruning","native-reference-and-formal","fibre-certification"]' || contains(github.event.head_commit.message, '[qualify-publication]') && '["governed-manuscript-publication"]' || '["family-computability","erased-certificate-work-boundary","hidden-parity-pruning","json-certificate-reference","finite-foundation-controls","native-reference-and-formal","fibre-certification","governed-manuscript-publication"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
      - name: Verify lossless archive extraction tools
        run: |
          command -v zstd || (sudo apt-get update && sudo apt-get install --yes zstd)
          command -v dpkg-deb
      - name: Build exact packs and assemble the thin replay candidate
        run: |
          python -B tools/rehydrate.py --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/source-cache" build-packs --dest "$RUNNER_TEMP/packs"
          python -B tools/rehydrate.py --root "$GITHUB_WORKSPACE" --cache "$RUNNER_TEMP/packs" assemble --dest "$RUNNER_TEMP/thin" > "$RUNNER_TEMP/thin-replay-assembly.json"
      - name: Deny old loose sources in the disposable qualification checkout
        run: |
          python -c 'import hashlib,json,os,subprocess
          from pathlib import Path
          checkout=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          thin=Path(os.environ["RUNNER_TEMP"])/"thin"
          lock=json.loads((thin/"corpus/archives.lock.json").read_text())
          profile=lock["profiles"]["ordinary"]
          paths=sorted(list(profile["existing_paths"].values())+profile["new_paths"])
          assert profile["initial_target"]==125 and len(paths)==len(set(paths))==125
          assert all(not p.startswith("/") and ".." not in p.split("/") and not any(c in p for c in "*?[]\\\n\r") for p in paths)
          def inventory(root):
              result=set()
              for base,dirs,files in os.walk(root):
                  if Path(base)==root and ".git" in dirs: dirs.remove(".git")
                  for name in dirs+files: assert not (Path(base)/name).is_symlink()
                  result.update((Path(base)/name).relative_to(root).as_posix() for name in files)
              return result
          assert inventory(thin)==set(paths), "assembled candidate differs from declared 125 paths"
          tracked=set(subprocess.check_output(["git","ls-files","-z"],cwd=checkout).decode().split("\0"))-{""}
          assert set(paths)<=tracked, "every ordinary candidate path must be committed before qualification"
          patterns="".join("/"+path+"\n" for path in paths)
          subprocess.run(["git","sparse-checkout","init","--no-cone"],cwd=checkout,check=True)
          subprocess.run(["git","sparse-checkout","set","--no-cone","--stdin"],cwd=checkout,input=patterns,text=True,check=True)
          assert inventory(checkout)==set(paths), "old loose inputs remain in qualification checkout"
          for rel in ["research/t20-v6-20261012","experiments/orthemology-v5-successors/source-store","experiments/orthemology-v5-continuations/source-store","manuscript/orthemma-ortheme-systems-revised-draft.md"]:
              assert not (checkout/rel).exists(), "legacy loose source remains: "+rel
          assert not subprocess.check_output(["git","status","--porcelain"],cwd=checkout).strip()
          baseline=lock["baseline"]["commit"]
          assert subprocess.check_output(["git","rev-parse",baseline+"^{tree}"],cwd=checkout,text=True).strip()==lock["baseline"]["tree"]
          receipt={"scope":"physical source isolation; scientific execution remains separate","files":125,"profile_paths_sha256":hashlib.sha256(patterns.encode()).hexdigest(),"baseline":baseline,"baseline_tree":lock["baseline"]["tree"],"old_loose_sources_absent":True,"history_access":"explicit verified Git-object route only"}
          (Path(os.environ["RUNNER_TEMP"])/"thin-replay-isolation.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          '
      - name: Acquire the exact public environment in a fresh isolated directory
        env:
          REPLAY_CASE: ${{ matrix.case }}
        run: |
          python -B "$RUNNER_TEMP/thin/tools/replay.py" --root "$RUNNER_TEMP/thin" --cache "$RUNNER_TEMP/packs" --offline --no-git-source --out "$RUNNER_TEMP/environment" --timeout 3600 provision "$REPLAY_CASE"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/environment/ENV.json")); f=open(os.environ["GITHUB_ENV"],"a"); [f.write(k+"="+d[k]+"\n") for k in ("REPLAY_PYTHON","LEAN_BIN","MATHLIB_DIR")]; f.close()'
      - name: Run unchanged original scientific gate with explicit scope
        env:
          REPLAY_CASE: ${{ matrix.case }}
        shell: bash
        run: |
          args=(--root "$RUNNER_TEMP/thin" --cache "$RUNNER_TEMP/packs" --offline --no-git-source --history-from-git "$GITHUB_WORKSPACE" --python "$REPLAY_PYTHON" --out "$RUNNER_TEMP/replay" --timeout 5400)
          if [[ -n "$LEAN_BIN" ]]; then args+=(--lean-bin "$LEAN_BIN" --mathlib "$MATHLIB_DIR"); fi
          if [[ "$REPLAY_CASE" == native-reference-and-formal ]]; then args+=(--historical-native); fi
          python -B "$RUNNER_TEMP/thin/tools/replay.py" "${args[@]}" case "$REPLAY_CASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/thin-replay-assembly.json
            ${{ runner.temp }}/thin-replay-isolation.json
            ${{ runner.temp }}/environment/ENV.json
            ${{ runner.temp }}/environment/RUN.json
            ${{ runner.temp }}/environment/command-*.log
            ${{ runner.temp }}/replay/RUN.json
            ${{ runner.temp }}/replay/command-*.log
            ${{ runner.temp }}/replay/evidence/
            ${{ runner.temp }}/replay/READBACKS.json
            ${{ runner.temp }}/replay/ORIGINAL-AXIOM-INVENTORIES.json
            ${{ runner.temp }}/replay/RENDER_MANIFEST.json
            ${{ runner.temp }}/replay/render-review/page-*.png
            ${{ runner.temp }}/replay/results/RECEIPT.json
            ${{ runner.temp }}/replay/results/VERIFICATION.json
            ${{ runner.temp }}/replay/results/v4/VERIFICATION.json
            ${{ runner.temp }}/replay/results/formal/FORMAL_RECEIPT.json
          retention-days: 14

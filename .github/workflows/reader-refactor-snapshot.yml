name: issue-35-sourcehood-candidate
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the unchanged dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact tested sourcehood and selection curation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue35-sourcehood"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/issue35-sourcehood" >> "$GITHUB_ENV"
          python - <<'PYCODE'
          import base64,lzma,hashlib,subprocess,os,json,urllib.request
          from pathlib import Path
          base='3227c8279facffaa81eddf13dd4edd587c0faa29'
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          if git('rev-parse','HEAD^') != base or git('rev-parse','HEAD') != os.environ['GITHUB_SHA']:
              raise SystemExit('Unexpected transport ancestry')
          if git('status','--porcelain'):raise SystemExit('Unclean checkout')
          url='https://api.github.com/repos/theislampill/orthemology/git/blobs/ce9b65f63069c971a4a0fdfc70de3225a6294bf3'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=45) as response: payload=json.load(response)
          if payload['sha']!='ce9b65f63069c971a4a0fdfc70de3225a6294bf3':raise SystemExit('Wrong patch blob')
          patch=lzma.decompress(base64.b64decode(payload['content']))
          if hashlib.sha256(patch).hexdigest()!='d6dae3659922cff29a0818c5628a06afa4ddf971c341c50fa093fb5ecfb9d8c9':raise SystemExit('Patch changed')
          out=Path(os.environ['RUNNER_TEMP'])/'issue35-sourcehood'
          (out/'authored.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero'],input=patch,check=True)
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['python','-B','scripts/generate_current_state.py'],check=True)
          subprocess.run(['python','-B','scripts/make_manifest.py'],check=True)
          subprocess.run(['git','add','--','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'],check=True)
          allowed=set(['docs/current-state.yaml', 'docs/project-closure/reader-refactor-issue-35/COLLECTION-COVERAGE.md', 'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json', 'docs/project-closure/reader-refactor-issue-35/PROGRESS.md', 'docs/provenance/RELEASE-MANIFEST.sha256', 'docs/reader/APPLICATIONS.md', 'docs/reader/CURRENT-FRONTIERS.md', 'docs/reader/PAPER-CATALOGUE.md', 'docs/reader/RESEARCH-ATLAS.md', 'docs/reader/RESULT-INDEX.md', 'docs/reader/VERIFICATION-GUIDE.md', 'tests/test_reader_pilot.py'])
          changed=set(git('diff',base,'--name-only').splitlines())
          if changed!=allowed:raise SystemExit('Unapproved write set: '+repr(changed^allowed))
          if git('write-tree')!='c388b7f96817c5e54331cc06a90665f1e3d8be9f':raise SystemExit('Local/native tree mismatch')
          (out/'candidate.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':'c388b7f96817c5e54331cc06a90665f1e3d8be9f','source_base':'0784acddd4770f1190f758f264ba52b2b110bd27'},indent=2)+'\n')
          PYCODE
      - name: Check the exact candidate without reclassifying scholarship
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/references.txt"
      - name: Upload only the tested Git objects; leave branch publication to the connector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os,json,base64,subprocess,urllib.request
          from pathlib import Path
          base='3227c8279facffaa81eddf13dd4edd587c0faa29'
          expected='c388b7f96817c5e54331cc06a90665f1e3d8be9f'
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          if git('write-tree')!=expected:raise SystemExit('Candidate drift after checks')
          api='https://api.github.com/repos/theislampill/orthemology'
          def request(path,data=None):
              req=urllib.request.Request(api+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          ref=request('/git/ref/heads/refactor/issue-35-research-reader-20261012')
          if ref['object']['sha']!=os.environ['GITHUB_SHA']:raise SystemExit('Remote head advanced; no publication')
          elements=[]
          for path in ['docs/current-state.yaml', 'docs/project-closure/reader-refactor-issue-35/COLLECTION-COVERAGE.md', 'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json', 'docs/project-closure/reader-refactor-issue-35/PROGRESS.md', 'docs/provenance/RELEASE-MANIFEST.sha256', 'docs/reader/APPLICATIONS.md', 'docs/reader/CURRENT-FRONTIERS.md', 'docs/reader/PAPER-CATALOGUE.md', 'docs/reader/RESEARCH-ATLAS.md', 'docs/reader/RESULT-INDEX.md', 'docs/reader/VERIFICATION-GUIDE.md', 'tests/test_reader_pilot.py']:
              p=Path(path);body=p.read_bytes()
              blob=request('/git/blobs',{'content':base64.b64encode(body).decode(),'encoding':'base64'})['sha']
              mode,oid,_=git('ls-files','-s','--',path).split(None,2)
              if blob!=oid:raise SystemExit('Uploaded blob identity differs: '+path)
              elements.append({'path':path,'mode':mode,'type':'blob','sha':blob})
          elements.append({'path':'.github/workflows/reader-refactor-snapshot.yml','mode':'100644','type':'blob','sha':None})
          actual=request('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':elements})['sha']
          if actual!=expected:raise SystemExit('Uploaded tree identity differs')
          out=Path(os.environ['EVIDENCE_DIR'])
          (out/'uploaded-tree.json').write_text(json.dumps({'tree':actual,'parent':os.environ['GITHUB_SHA'],'branch_advanced':False},indent=2)+'\n')
          print('Exact tested tree uploaded:',actual)
          print('No branch ref, merge, release or scientific source modified by this step.')
          PYCODE
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-sourcehood-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-sourcehood/
          retention-days: 14
          if-no-files-found: error

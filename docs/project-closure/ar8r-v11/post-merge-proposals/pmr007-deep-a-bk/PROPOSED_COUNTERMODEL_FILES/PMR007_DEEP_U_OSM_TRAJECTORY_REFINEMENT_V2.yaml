candidate_claims:
  TRPD_1_ENDPOINT_NONSufficiency: Endpoint OSM-like status does not decide the reported trajectory-match relation on the registered class.
  TRPD_2_TRACE_REFINEMENT: The independently declared endpoint-plus-trajectory-signature profile decides the registered match relation.
  TRPD_3_FAMILY_NONSufficiency: Model-family identity does not decide the registered trajectory-match relation because CSCG encoding controls differ.
  TRPD_4_AMONG_TESTED_NARROWING: In the bounded registered extraction, the animal-matching signature narrows the endpoint-matched computational instances to the default CSCG comparison.
  TRPD_5_MECHANISM_NONTRANSFER: Endpoint and trajectory equivalence do not identify a unique computational or biological mechanism.
  TRPD_6_SOUNDNESS_NONTRANSFER: Orthogonalized geometry and task trajectory do not establish strict soundness, truth linkage, or proper function.

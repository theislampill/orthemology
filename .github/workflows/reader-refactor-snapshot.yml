name: issue35 native root qualification
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Exact dependencies
        run: pip install --quiet -r requirements-ci.lock.txt
      - name: Apply hash-bound root-navigation change; remove transport helper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b9e3d50e725b3391229c5818cc91bb15a64fefbf
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/reader-refactor-snapshot.yml
          mkdir -p "$RUNNER_TEMP/issue35-root"
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          encoded = ''''''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != 'c8e2851ddf19add4f28dfae1211cad6a9d9bf619f3cb0be4c3a3f6ab566ab4e2':
              raise SystemExit('patch identity mismatch')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-root'
          (out / 'root.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','--unidiff-zero','-'], input=patch, check=True)
          subprocess.run(['git','rm','.github/workflows/reader-refactor-snapshot.yml'], check=True)
          PY
          python scripts/generate_current_state.py
          python scripts/make_manifest.py
          git add docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = f0e31b1b304bc1c39ed831ea8a4ecfaa29c615f9
          git diff --cached --check
      - name: Native identity, navigation and policy controls
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-root"
          python -B tests/test_reader_census.py > "$out/census.log" 2>&1
          python -B -O tests/test_reader_census.py > "$out/census-optimized.log" 2>&1
          python -B tests/test_reader_pilot.py > "$out/reader.log" 2>&1
          python -B -O tests/test_reader_pilot.py > "$out/reader-optimized.log" 2>&1
          python -B scripts/check_reader_pilot.py > "$out/check.log" 2>&1
          python scripts/validate_current_state.py > "$out/state.log" 2>&1
          python scripts/validate_repo.py > "$out/hygiene.log" 2>&1
          python scripts/validate_review_state.py > "$out/review-state.log" 2>&1
          python scripts/validate_internal_references.py > "$out/references.log" 2>&1
          python scripts/generate_current_state.py --check > "$out/convergence.log" 2>&1
          python scripts/generate_current_state.py
          python scripts/make_manifest.py
          git diff --exit-code
          test "$(git write-tree)" = f0e31b1b304bc1c39ed831ea8a4ecfaa29c615f9
      - name: Publish tested tree objects only; no branch mutation or acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue35-root'
          base='b9e3d50e725b3391229c5818cc91bb15a64fefbf'
          expected='f0e31b1b304bc1c39ed831ea8a4ecfaa29c615f9'
          paths=subprocess.check_output(['git','diff','--cached','--name-only',base]).decode().splitlines()
          entries=[]
          for path in paths:
              p=pathlib.Path(path)
              row={'path':path,'mode':'100644','type':'blob'}
              if p.is_file(): row['content']=p.read_text(encoding='utf-8')
              elif path=='.github/workflows/reader-refactor-snapshot.yml': row['sha']=None
              else: raise SystemExit('unexpected deleted path '+path)
              entries.append(row)
          request=out/'tree-request.json'
          request.write_text(json.dumps({'base_tree':'3f1dc91e702b575b18e8dc03175b8168d0cfcc6f','tree':entries}))
          response=subprocess.check_output(['gh','api','--method','POST','repos/theislampill/orthemology/git/trees','--input',str(request)])
          tree=json.loads(response)['sha']
          if tree!=expected: raise SystemExit('remote/local tree mismatch')
          request.unlink()
          (out/'IDENTITY.json').write_text(json.dumps({'transport_head':os.environ['GITHUB_SHA'],'content_tree':tree,'source_parent':base,'normal_ci':'NOT_YET_QUALIFIED','independent_review':'NOT_PERFORMED','acceptance':'NOT_CLAIMED','files':paths},indent=2)+'\n')
          lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(out.iterdir()) if p.is_file()]
          (out/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          print('Tested remote tree:',tree)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue35-native-root-qualification
          path: ${{ runner.temp }}/issue35-root/
          retention-days: 14

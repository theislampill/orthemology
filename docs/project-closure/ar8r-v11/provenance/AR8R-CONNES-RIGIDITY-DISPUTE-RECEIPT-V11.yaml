blocking_defects:
  - {id: N-01, finding: Ioana Theorem 8.2 is misstated; nonintertwining hypotheses and torsion-general conclusion are omitted.}
  - {id: N-02, finding: Cases I and II are not eliminated; the declared containment supplies rather than defeats the Case II intertwiner.}
  - {id: N-03, finding: Coordinate injectivity uses an unestablished normal map and is circular.}
  - {id: N-04, finding: The finite-index conclusion is unsupported.}
  - {id: N-05, finding: Tower termination is circular and the property-(T)-implies-finite-depth principle is false in general.}
  - {id: N-06, finding: Borel density and Margulis superrigidity are overapplied.}
  - {id: N-07, finding: Extension-cohomology compatibility omits the fibre map.}
  - {id: N-08, finding: Mutual embeddings are promoted to isomorphism without a valid bridge.}
  - {id: N-09, finding: The exact OpenAI object is misidentified.}
  - {id: N-10, finding: The generic direct-product Lean appendix is irrelevant to the exact source object.}
  - id: N-11
    finding: "The positive Lean appendix assumes classification, eliminations, injectivity, and surjectivity burdens."
  - {id: N-12, finding: Torsor and principal-bundle claims are false or category-confused.}
  - {id: N-13, finding: Property (T) is asserted to pass to arbitrary extensions without needed hypotheses.}
  - {id: N-14, finding: DHR/QFT and physical conclusions exceed the established objects.}

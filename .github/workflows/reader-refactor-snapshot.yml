name: issue35 late context native qualification
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - run: pip install --quiet -r requirements-ci.lock.txt
      - name: Verify immutable reviewed recipe and exact starting point
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7c30b0b8c9a3af3b3deb6113495c4b0986c7e135
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/reader-refactor-snapshot.yml
          mkdir -p "$RUNNER_TEMP/issue35-late-context"
          python - <<'PY'
          import ast, base64, hashlib, json, lzma, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-late-context'
          oid = '7cdc8d3d1ea31fbd58824bfbc1e9045481d80438'
          record = json.loads(subprocess.check_output(['gh', 'api', 'repos/theislampill/orthemology/git/blobs/' + oid]))
          compressed = base64.b64decode(record['content'])
          if hashlib.sha1(b'blob ' + str(len(compressed)).encode() + b'\0' + compressed).hexdigest() != oid:
              raise SystemExit('transport Git identity mismatch')
          raw = lzma.decompress(compressed)
          if hashlib.sha256(raw).hexdigest() != 'cfdb6dabb15b78da6f65270a44def25679da5d973457be244bb1ff4b089a36a7':
              raise SystemExit('reviewed payload mismatch')
          (out / 'payload.json').write_bytes(raw)
          p = json.loads(raw)
          ast.parse(p['recipe'], feature_version=(3, 11))
          test = pathlib.Path('tests/test_reader_pilot.py')
          original = test.read_text()
          if original.count('if __name__') != 1:
              raise SystemExit('ambiguous test entry point')
          test.write_text(original.replace('if __name__', p['test_addition'] + '\nif __name__', 1))
          if hashlib.sha256(test.read_bytes()).hexdigest() != p['sha256'][str(test)]:
              raise SystemExit('test payload mismatch')
          (out / 'curation.py').write_text(p['recipe'])
          PY
      - name: Observe four genuine missing-route failures before implementation
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-late-context"
          set +e
          python -B tests/test_reader_pilot.py LateTwentiethContextRoutesTests > "$out/red.log" 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -q 'FAILED (failures=4)' "$out/red.log"
          grep -q 'missing-work:t20-cooperation-context' "$out/red.log"
      - name: Apply reviewed source-bound curation and prove exact final tree
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/issue35-late-context/curation.py"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-late-context'
          p = json.loads((out / 'payload.json').read_bytes())
          generated = {'docs/current-state.yaml', 'docs/provenance/RELEASE-MANIFEST.sha256'}
          for name, expected in p['sha256'].items():
              if name not in generated and hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('authored payload mismatch: ' + name)
          pathlib.Path('.github/workflows/reader-refactor-snapshot.yml').unlink()
          subprocess.run(['git', 'add', '-u'], check=True)
          subprocess.run(['python', '-B', 'scripts/generate_current_state.py'], check=True)
          subprocess.run(['python', '-B', 'scripts/make_manifest.py'], check=True)
          subprocess.run(['git', 'add', *sorted(generated)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', p['base']], text=True).splitlines())
          if changed != set(p['sha256']):
              raise SystemExit('exact write scope mismatch')
          for name, expected in p['sha256'].items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('candidate byte mismatch: ' + name)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != p['tree']:
              raise SystemExit('candidate tree mismatch')
          name = 'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json'
          before = json.loads(subprocess.check_output(['git', 'show', p['base'] + ':' + name]))
          after = json.loads(pathlib.Path(name).read_bytes())
          if after['works'][:len(before['works'])] != before['works'] or any(after['sources'].get(k) != v for k, v in before['sources'].items()):
              raise SystemExit('earlier curated records changed')
          identity = {'base': p['base'], 'tree': tree, 'transport_head': os.environ['GITHUB_SHA'], 'scope': 'late cooperation, typed emergence and activity context; not whole C03/C04 or independent C05'}
          (out / 'identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          (out / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary', p['base']]))
          print('Exact candidate tree', tree)
          PY
      - name: Full reader and census regressions including existing M01 to M05
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-late-context"
          python -B tests/test_reader_pilot.py > "$out/reader-normal.log" 2>&1
          python -B -O tests/test_reader_pilot.py > "$out/reader-optimized.log" 2>&1
          python -B tests/test_reader_census.py > "$out/census-normal.log" 2>&1
          python -B -O tests/test_reader_census.py > "$out/census-optimized.log" 2>&1
          python -B scripts/check_reader_pilot.py > "$out/reader-check.log" 2>&1
      - name: Unchanged production projection and preservation gates
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-late-context"
          python -B tests/test_t20_v6_projection.py > "$out/projection-normal.log" 2>&1
          python -B -O tests/test_t20_v6_projection.py > "$out/projection-optimized.log" 2>&1
          python -B scripts/validate_t20_v6_projection.py > "$out/projection-check.log" 2>&1
          python -B scripts/generate_current_state.py --check > "$out/drift.log" 2>&1
          python -B scripts/validate_repo.py > "$out/hygiene.log" 2>&1
          python -B scripts/validate_current_state.py > "$out/state.log" 2>&1
          python -B scripts/validate_review_state.py > "$out/review-state.log" 2>&1
          python -B scripts/validate_internal_references.py > "$out/references.log" 2>&1
          python -B scripts/validate_state_convergence.py > "$out/convergence.log" 2>&1
          before=$(git write-tree)
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = "$before"
      - name: Export exact qualified tree objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-late-context'
          p = json.loads((out / 'payload.json').read_bytes())
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != p['tree']:
              raise SystemExit('qualified tree changed')
          repo = 'repos/theislampill/orthemology'
          def api(endpoint, data):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', repo + endpoint, '--input', '-'], input=json.dumps(data).encode()))
          elements = []
          for path in sorted(p['sha256']):
              body = pathlib.Path(path).read_bytes()
              if hashlib.sha256(body).hexdigest() != p['sha256'][path]:
                  raise SystemExit('qualified bytes changed: ' + path)
              local = hashlib.sha1(b'blob ' + str(len(body)).encode() + b'\0' + body).hexdigest()
              blob = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(body).decode()})
              if blob['sha'] != local:
                  raise SystemExit('uploaded blob mismatch')
              elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': local})
          tree = api('/git/trees', {'base_tree': p['base_tree'], 'tree': elements})
          if tree['sha'] != p['tree']:
              raise SystemExit('uploaded tree mismatch')
          (out / 'uploaded-tree.json').write_text(json.dumps({'tree': tree['sha'], 'files': sorted(p['sha256']), 'remote_ref_moved': False}, indent=2) + '\n')
          print('Exported exact qualified tree', tree['sha'])
          PY
      - name: Seal available evidence without upgrading failures
        if: always()
        run: |
          python - <<'PY'
          import hashlib, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-late-context'
          out.mkdir(exist_ok=True)
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in sorted(out.iterdir()) if p.is_file() and p.name != 'SHA256SUMS']
          (out / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue35-late-context-qualification
          path: ${{ runner.temp }}/issue35-late-context/
          retention-days: 14

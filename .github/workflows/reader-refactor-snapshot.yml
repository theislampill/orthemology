name: issue-35-identity-checkpoint
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-identity-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact tested identity curation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = a5376da9d7b261ca6baf0f454713be473746a358
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-identity"
          printf 'EVIDENCE_DIR=%s/issue35-identity\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY_APPLY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'issue35-identity'
          (out/'transfer.txt').write_text('Ten-file source-bound identity reader/test patch; original science protected.\n')
          payload = '''
          
          
          '''
          packed = base64.b64decode(''.join(payload.split()), validate=True)
          if len(packed) != 15488 or hashlib.sha256(packed).hexdigest() != '2412adc191f8c849981d2ed9a1d14e6eaa9da5c4fdf3c142c8dd38c7b2de1542':
              raise SystemExit('Compressed patch identity mismatch')
          patch = lzma.decompress(packed)
          if len(patch) != 64659 or hashlib.sha256(patch).hexdigest() != 'e3975819ae533472148aae9dac7b0612c30fb35f1862e131a5a647b21d1de992':
              raise SystemExit('Patch identity mismatch')
          p = out/'authored.patch'
          p.write_bytes(patch)
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero',str(p)],check=True)
          allowed = {
              'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json',
              'docs/project-closure/reader-refactor-issue-35/IDENTITY-COVERAGE.md',
              'docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json',
              'docs/reader/APPLICATIONS.md',
              'docs/reader/CURRENT-FRONTIERS.md',
              'docs/reader/PAPER-CATALOGUE.md',
              'docs/reader/RESEARCH-ATLAS.md',
              'docs/reader/RESULT-INDEX.md',
              'docs/reader/VERIFICATION-GUIDE.md',
              'tests/test_reader_pilot.py',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only','a5376da9d7b261ca6baf0f454713be473746a358']).decode().splitlines())
          if actual != allowed:
              raise SystemExit('Unexpected authored write set: '+repr(sorted(actual)))
          print('PASS: exact ten-file source-bound identity curation patch')
          PY_APPLY
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = e81efec7c3233d969094a8e234fda8b5f9489209
          git diff --exit-code
      - name: Qualify the exact identity curation tree
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-opt.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-tests.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-tests-opt.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/current-state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/references.txt"
          git diff --cached --check
      - name: Save only the exact checked feature tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = e81efec7c3233d969094a8e234fda8b5f9489209
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: curate identity separation, finite certificates and the separate HasE repair'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/tree.txt"
          git update-ref refs/heads/issue35-identity-checkpoint HEAD
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" refs/heads/issue35-identity-checkpoint ^a5376da9d7b261ca6baf0f454713be473746a358
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed evidence without claiming full PR acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-identity-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-identity/
          retention-days: 14
          if-no-files-found: error

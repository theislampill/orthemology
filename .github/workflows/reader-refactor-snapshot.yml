name: issue-35-report-reanalysis-checkpoint
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-report-reanalysis-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact tested report and research-software curation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = de52afda4296ba788c3f863816505b9f43cf8457
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          export EVIDENCE_DIR="$RUNNER_TEMP/issue35-report-reanalysis"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python - <<'PY_APPLY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          import yaml
          out=Path(os.environ['EVIDENCE_DIR'])
          payload=""""""
          packed=base64.b64decode(''.join(payload.split()),validate=True)
          if len(packed)!=12736 or hashlib.sha256(packed).hexdigest()!='fb785f8756d1c8057bf07c8ec34053c3a91c27cf55f8e8b817c343be903903b0':
              raise SystemExit('Compressed patch identity mismatch')
          patch=lzma.decompress(packed)
          if len(patch)!=50490 or hashlib.sha256(patch).hexdigest()!='f5471f5f63d175bc96ae2d3bcda3d8dee3e7d33d525853c4349bd1ab08b8dac5':
              raise SystemExit('Authored patch identity mismatch')
          p=out/'authored.patch'; p.write_bytes(patch)
          before=yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['git','apply','--check','--index','--binary','--unidiff-zero',str(p)],check=True)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero',str(p)],check=True)
          allowed=['docs/project-closure/reader-refactor-issue-35/CROSSWALK.json', 'docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json', 'docs/project-closure/reader-refactor-issue-35/REPORT-REANALYSIS-COVERAGE.md', 'docs/reader/APPLICATIONS.md', 'docs/reader/CURRENT-FRONTIERS.md', 'docs/reader/PAPER-CATALOGUE.md', 'docs/reader/RESEARCH-ATLAS.md', 'docs/reader/RESULT-INDEX.md', 'docs/reader/VERIFICATION-GUIDE.md', 'scripts/check_reader_pilot.py', 'tests/test_reader_pilot.py']
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only','de52afda4296ba788c3f863816505b9f43cf8457']).decode().splitlines())
          if actual!=set(allowed):
              raise SystemExit('Unexpected authored write set: '+repr(sorted(actual)))
          subprocess.run(['python','-B','scripts/generate_current_state.py'],check=True)
          if yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']!=before:
              raise SystemExit('Authored state changed')
          subprocess.run(['python','-B','scripts/make_manifest.py'],check=True)
          subprocess.run(['git','add','--','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          (out/'observed-tree.txt').write_text(tree+'\n')
          if tree!='3f6b35370c1bc703168aff69dec1b575ff3d9a13':
              raise SystemExit('Expected tested tree mismatch: '+tree)
          subprocess.run(['git','diff','--exit-code'],check=True)
          (out/'scope.txt').write_text('Source-bound report/software reader checkpoint. No participant inputs, scientific reanalysis, independent review or whole-corpus acceptance.\n')
          print('PASS: exact eleven-file authored patch and existing generated outputs')
          PY_APPLY
      - name: Qualify the exact reader tree without running participant analysis
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-normal.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-optimized.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-normal.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/t20-projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/state-drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/current-state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/internal-references.txt"
      - name: Publish only the exact checked feature checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 3f6b35370c1bc703168aff69dec1b575ff3d9a13
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: publish tested Fifteenth report and reanalysis reader routes'
          test "$(git rev-parse HEAD^{tree})" = 3f6b35370c1bc703168aff69dec1b575ff3d9a13
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/committed-state.txt"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/tree.txt"
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" HEAD ^583c52a9f41a4f30538824a3710119fda3b1a341
          git bundle verify "$EVIDENCE_DIR/checkpoint.bundle" 2>&1 | tee "$EVIDENCE_DIR/bundle-verification.txt"
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Retain observed checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-report-reanalysis-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-report-reanalysis/
          retention-days: 14
          if-no-files-found: error

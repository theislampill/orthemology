name: issue-35-checkpoint-06

# Temporary owner-authorised checkpoint. Apply only the listed, locally tested
# historical metadata, reader-validator/test and recovery-note changes. Preserve
# all original research, generated-output ownership and required CI gates.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-checkpoint-06
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install existing locked dependencies
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact historical binding and reader gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 052ac475fbc70cb6e4b9c22a68bf571df0720888
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-checkpoint06"
          printf 'EVIDENCE_DIR=%s/issue35-checkpoint06\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess
          root=Path.cwd()
          identity='94fb4c0a0fbe7406570711b222ac0e5dbc7493867cd28cb6f0ef08c6fea99074'
          manifest=root/'research/t20-v6-20261012/PUBLIC_PROJECTION_MANIFEST.json'
          text=manifest.read_text(); doc=json.loads(text)
          matches=[r for r in doc['objects'] if r['source_sha256']==identity]
          if len(matches)!=1: raise ValueError('Ambiguous historical source')
          row=matches[0]
          def render(value):
              return '\n'.join('    '+line for line in json.dumps(value,indent=2,ensure_ascii=False).splitlines())
          old=render(row)
          if text.count(old)!=1 or 'repository_revision' in row: raise ValueError('Unexpected historical preimage')
          historical=subprocess.check_output(['git','show','7efc6217c090b92d65f2c4cb8b011c18eb96bf7c:docs/project-closure/HISTORICAL-STATUS-INDEX.yaml'])
          if len(historical)!=5312 or hashlib.sha256(historical).hexdigest()!=identity: raise ValueError('Original source absent')
          row.update(repository_revision='7efc6217c090b92d65f2c4cb8b011c18eb96bf7c',git_blob='d4ec27e7da404b830f1a6fe687809c1cf2011413')
          manifest.write_text(text.replace(old,render(row)))
          p=root/'scripts/check_reader_pilot.py'; s=p.read_text()
          function='''def permitted_historical_status_pin(repo, row, body):
              """Admit one exact historical metadata reference, never rewritten science.

              The current status index acquired this work order's candidate classification.
              T20 still owns its original bytes. Resolve that one REUSE record at the
              existing T20 baseline, using the resolver's already supported historical form.
              No other record, eligibility, count, source/public hash or status may change.
              """
              if row["path"] != "research/t20-v6-20261012/PUBLIC_PROJECTION_MANIFEST.json":
                  return False
              original = subprocess.run(["git", "cat-file", "blob", row["git_oid"]],
                                        cwd=repo, capture_output=True, check=False)
              if original.returncode:
                  return False
              try:
                  expected = json.loads(original.stdout, object_pairs_hook=unique_object)
                  candidate = json.loads(body, object_pairs_hook=unique_object)
                  identity = "94fb4c0a0fbe7406570711b222ac0e5dbc7493867cd28cb6f0ef08c6fea99074"
                  selected = [r for r in expected["objects"] if r["source_sha256"] == identity]
                  if len(selected) != 1:
                      return False
                  source = selected[0]
                  if (source.get("disposition") != "REUSE"
                          or source.get("repository_path") != "docs/project-closure/HISTORICAL-STATUS-INDEX.yaml"
                          or source.get("source_bytes") != 5312
                          or source.get("public_bytes") != 5312
                          or source.get("public_sha256") != identity):
                      return False
                  source.update(repository_revision="7efc6217c090b92d65f2c4cb8b011c18eb96bf7c",
                                git_blob="d4ec27e7da404b830f1a6fe687809c1cf2011413")
                  return candidate == expected
              except (KeyError, TypeError, ValueError):
                  return False


          '''
          marker='def check(repo, owners, cross):'
          if s.count(marker)!=1 or 'def permitted_historical_status_pin' in s: raise ValueError('Unexpected checker preimage')
          s=s.replace(marker,function+marker)
          old='if digest != row["git_oid"] and not permitted_reader_ci_addition(repo, row, body):'
          if s.count(old)!=1: raise ValueError('Unexpected owner guard')
          s=s.replace(old,'if (digest != row["git_oid"]\n                    and not permitted_reader_ci_addition(repo, row, body)\n                    and not permitted_historical_status_pin(repo, row, body)):')
          p.write_text(s)
          p=root/'tests/test_reader_pilot.py';s=p.read_text()
          tests='''
          class HistoricalMetadataPinTests(unittest.TestCase):
              """Historical source custody survives an authorised current-index addition."""
              @classmethod
              def setUpClass(cls):
                  spec = importlib.util.spec_from_file_location("reader_metadata_pin", MODULE)
                  cls.mod = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(cls.mod)
                  owner_path = ROOT / "docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json"
                  baseline = json.loads(owner_path.read_text())["baseline"]["commit"]
                  cls.manifest_path = "research/t20-v6-20261012/PUBLIC_PROJECTION_MANIFEST.json"
                  oid = subprocess.check_output(["git", "rev-parse", baseline + ":" + cls.manifest_path], cwd=ROOT).decode().strip()
                  cls.row = {"path": cls.manifest_path, "git_oid": oid}
                  cls.original = json.loads(subprocess.check_output(["git", "cat-file", "blob", oid], cwd=ROOT))
                  cls.identity = "94fb4c0a0fbe7406570711b222ac0e5dbc7493867cd28cb6f0ef08c6fea99074"

              def candidate(self):
                  value = deepcopy(self.original)
                  row = next(r for r in value["objects"] if r["source_sha256"] == self.identity)
                  row.update(repository_revision="7efc6217c090b92d65f2c4cb8b011c18eb96bf7c",
                             git_blob="d4ec27e7da404b830f1a6fe687809c1cf2011413")
                  return value, row

              def permitted(self, value):
                  gate = getattr(self.mod, "permitted_historical_status_pin", None)
                  return bool(gate and gate(ROOT, self.row, json.dumps(value).encode()))

              def test_exact_historical_status_pin_preserves_source_identity(self):
                  value, row = self.candidate()
                  self.assertTrue(self.permitted(value), "the exact historical metadata pin is not admitted")
                  self.assertEqual(row["public_sha256"], self.identity)
                  self.assertEqual(row["source_bytes"], 5312)

              def test_historical_pin_cannot_replace_the_scientific_source_hash(self):
                  value, row = self.candidate()
                  row["public_sha256"] = "0" * 64
                  self.assertFalse(self.permitted(value))

              def test_historical_pin_cannot_use_a_moving_revision(self):
                  value, row = self.candidate()
                  row["repository_revision"] = "HEAD"
                  self.assertFalse(self.permitted(value))

              def test_historical_pin_cannot_change_an_unrelated_row(self):
                  value, row = self.candidate()
                  value["objects"][0]["role"] = "reclassified"
                  self.assertFalse(self.permitted(value))

              def test_historical_pin_cannot_claim_another_git_blob(self):
                  value, row = self.candidate()
                  row["git_blob"] = "0" * 40
                  self.assertFalse(self.permitted(value))

          '''
          marker='if __name__ == "__main__":'
          if s.count(marker)!=1 or 'class HistoricalMetadataPinTests' in s: raise ValueError('Unexpected tests preimage')
          p.write_text(s.replace(marker,tests+'\n'+marker))
          p=root/'docs/project-closure/reader-refactor-issue-35/RECOVERY-04.md'
          note='''

          ## Resumption 06 — recover the latest checkpoint and repair the historical metadata reference

          The next owner-requested recovery found PR 36 at `052ac475fbc70cb6e4b9c22a68bf571df0720888`, tree `9703e30953f2938e0382b330dc01d46a9eca926b`, with 56 saved commits. The 24-work/62-source crosswalk, six pages, previous fixture repairs and merged main `0784acddd4770f1190f758f264ba52b2b110bd27` survived. They were not restarted. Existing Actions artifacts 11822673589, 11832261375 and 11833650374 were downloaded; their archive hashes and respectively six, five and twelve member hashes matched. Their Git bundles reconstructed the exact content tree. The subsequent file-identical trigger commit was imported only after its canonical Git hash matched. The original archives remain unchanged. Direct remote Git transport still could not resolve GitHub; connector and existing-artifact transport succeeded.

          The actual normal CI failure is [run 38435934592](https://github.com/theislampill/orthemology/actions/runs/38435934592), not either earlier failure. Its hygiene and reader gates passed. T20 projection validation then rejected source `94fb4c0a0fbe7406570711b222ac0e5dbc7493867cd28cb6f0ef08c6fea99074`: the manifest still reused the live historical-status index, whose current edition now includes this work order's candidate classification. Both records have legitimate but different roles. Updating the old source hash to the new index would falsely rewrite history; reverting the classification would reintroduce the earlier review-state defect.

          Ruling: use the T20 resolver's already supported **pinned historical REUSE** form for this one metadata row. The original 5,312 bytes are present at T20 baseline `7efc6217c090b92d65f2c4cb8b011c18eb96bf7c`, Git blob `d4ec27e7da404b830f1a6fe687809c1cf2011413`, with exactly the original SHA-256. Add only `repository_revision` and `git_blob` to that row. Preserve every other row, source/public hash, count, eligibility decision, proof body and acceptance flag. The mutable current index keeps its candidate rule. No source is reconstructed or newly published.

          This adds the exact manifest path `research/t20-v6-20261012/PUBLIC_PROJECTION_MANIFEST.json` to the admitted write set solely for that two-field historical-reference correction. The reader checker admits only this exact change compared with its pinned discovery owner; it does not gain a general mutable-owner exemption. Five read-only controls reject moving revisions, replacement source hashes, an unrelated row change and an incorrect Git blob while accepting the exact pin. The positive control failed before the checker repair. All 62 reader tests then passed normally and under optimisation, and both the real reader check and existing T20 projection validator passed locally. The production T20 validator and its existing negative-control suite were not changed.

          The full local T20 test-file invocation exceeded its 65-second command deadline after partial output. It is **not** recorded as a pass. Local Python remains 3.13.5; pinned-environment and normal CI results must be read from their own runs. This checkpoint is a prerequisite repair, not C03 completion or independent acceptance. Next, continue the substantive collection/work mapping and catalogue expansion from the already tested design. Do not count this operational metadata repair as new scholarship.
          '''
          p.write_text(p.read_text()+note)
          PY
          git rm -- .github/workflows/reader-refactor-snapshot.yml
          git add -- scripts/check_reader_pilot.py tests/test_reader_pilot.py research/t20-v6-20261012/PUBLIC_PROJECTION_MANIFEST.json docs/project-closure/reader-refactor-issue-35/RECOVERY-04.md
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = 3bb5332ced161601ccad287c6959c4479634d7da
      - name: Qualify the exact candidate without weakening any gate
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/pilot.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/pilot-opt.txt"
          python -B scripts/check_reader_pilot.py | tee "$EVIDENCE_DIR/reader.txt"
          python -B tests/test_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection-tests.txt"
          python -B -O tests/test_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection-tests-opt.txt"
          python -B scripts/validate_t20_v6_projection.py | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_repo.py | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_review_state.py | tee "$EVIDENCE_DIR/review.txt"
          python -B scripts/validate_internal_references.py | tee "$EVIDENCE_DIR/references.txt"
      - name: Save the checked feature checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 3bb5332ced161601ccad287c6959c4479634d7da
          git diff --exit-code
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve the original T20 status-index source alongside current reader classification'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/tree.txt"
          git update-ref refs/heads/issue35-checkpoint HEAD
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" refs/heads/issue35-checkpoint ^052ac475fbc70cb6e4b9c22a68bf571df0720888
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Retain observed checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-checkpoint06-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-checkpoint06/
          retention-days: 14
          if-no-files-found: error

q1_t299_formalization:
  status: ELABORATED_AND_KERNEL_CHECKED
  scope: >
    A repaired, scoped interpretation of T299's quotient-factorization structure.
    The original historical T299 packet was not machine-checked end to end;
    the specification-defects packet records where the interpretation required a
    choice.
  source: lean/T299/Basic.lean
  receipts_source: lean/T299/Receipts.lean
  target_packet: docs/project-closure/ar8r-v11/theorems/ar8r-t299-matched-intervention-burden-landing.md
  parse: PASS
  elaboration: PASS
  kernel: PASS
  sorry_count: 0
  custom_axioms_introduced: 0
  axiom_report:
    standard_axioms_only: true
    axioms_used_across_corpus: [propext, Classical.choice, Quot.sound]
    declarations_with_no_axioms: 7
    declarations_with_standard_axioms: 7
    classical_choice_use_site: >
      Right-to-left direction of certifiable_iff_fibreConst, to select a
      representative from each attained fibre; inherited by the declarations
      that invoke that characterization.
  declarations_checked: 14
  declarations:
    - name: certifiable_iff_fibreConst
      role: main characterization, valid for an arbitrary label
      axioms: [propext, Classical.choice, Quot.sound]
    - name: fibreConst_iff_noDisagreeingPair
      role: proves the packet's word "Equivalently"
      axioms: []
    - name: certifiable_of_injective
      role: >
        injective profile maps certify every label; a general lemma. It does NOT
        discharge the packet's B* sufficiency remark (B* is not claimed
        injective); that remark is discharged by certifiable_matchedProfile. The
        original receipt misassigned this role.
      axioms: [propext, Classical.choice, Quot.sound]
    - name: certifiable_mono
      role: refinement monotonicity
      axioms: [propext, Classical.choice, Quot.sound]
    - name: A4_requires_reading_is_insufficient
      role: >
        generic supporting lemma for defect A4 - necessary clauses need not
        determine an independently selected label. Instantiated at Bool/Unit;
        does not use the Model/matchedProfile/L machinery, and on its own does
        not machine-check the T299-specific defect.
      axioms: []
    - name: A4_matchedProfile_insufficient_under_requires_reading
      role: >
        T299-specific A4 witness, added in the post-review correction - an
        actual Model whose two backgrounds share one matchedProfile while a
        label satisfying the merely-necessary reading differs across them.
      axioms: []
    - name: A4_matchedProfile_not_certifiable_under_requires_reading
      role: the same witness restated as non-certifiability by B*
      axioms: [propext, Classical.choice, Quot.sound]
    - name: certifiable_matchedProfile
      role: B* certifies, for every model, with no finiteness hypothesis
      axioms: [propext, Classical.choice, Quot.sound]
    - name: twin_before_agree
      role: causal/spontaneous twin, before-observation agreement
      axioms: []
    - name: twin_after_agree
      role: causal/spontaneous twin, after-observation agreement
      axioms: []
    - name: twin_L_differs
      role: twin labels differ
      axioms: []
    - name: beforeAfter_not_certifiable
      role: the packet's scope-firewall claim, machine-checked
      axioms: [propext, Classical.choice, Quot.sound]
    - name: matched_separates_twin
      role: B* separates the twin
      axioms: []
    - name: matched_certifies_twin
      role: B* certifies the twin
      axioms: [propext, Classical.choice, Quot.sound]

executable_finite_check:
  scope: independent of the Lean development
  exhaustive_enumeration:
    status: PASS_REPRODUCIBLE
    checker: checks/t299_finite_check.py
    cases: 361164
    bound: background sets of size 1..6, profile spaces of size 1..4
    case_count_derivation: sum over b in 1..6, p in 1..4 of p^b * 2^b = 361164
    method: >
      Certificate existence decided by brute-force search over all functions
      from the profile space to Bool, i.e. from the definition, without
      appealing to the characterization.
    mismatches: 0
    note: >
      The original round-1 run committed no checker, so its numbers were
      unreproducible. The committed checker re-derives the identical case count
      and result; see the checker header for Python version, enumeration order,
      output schema, and result digest fields.

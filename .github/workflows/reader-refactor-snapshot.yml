name: issue-35-curation-checkpoint-05

# Temporary, exact-tree checkpoint on the owner-authorised feature branch.
# Only three editorial records, the existing generated outputs and this helper
# removal are admitted. No scientific source, main, merge or release writes.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-curation-checkpoint-05
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the unchanged locked dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements-ci.lock.txt
      - name: Apply the locally tested editorial transformation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 905631473eb0f35ae1506dddbd7aba656788744b
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-curation05"
          printf 'EVIDENCE_DIR=%s/issue35-curation05\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re
          root=Path.cwd(); d=root/'docs/project-closure/reader-refactor-issue-35'
          original=(d/'CROSSWALK.json').read_text(); c=json.loads(original);o=json.loads((d/'OWNER-MAP.json').read_text())
          old_source_keys=set(c['sources']); old_work_count=len(c['works']); old_relation_count=len(c['relations'])
          def source(key,path,scope):
              body=(root/path).read_bytes()
              if key in c['sources']: raise ValueError('refusing duplicate '+key)
              c['sources'][key]={'path':path,'sha256':hashlib.sha256(body).hexdigest(),'read_scope':scope}
          def work(key,title,keys,placement,anchor,sections,forms=None):
              if any(w['key']==key for w in c['works']):raise ValueError(key)
              c['works'].append({'key':key,'title':title,'role':'manuscript','source_keys':keys,
                 'reading_forms':forms or [{'source':keys[0],'relationship':'authored-source'}],
                 'placement':placement,'catalogue_entry':'docs/reader/PAPER-CATALOGUE.md#'+anchor,
                 'source_sections':sections,'review_status':'AUTHOR_PREPARED; independent candidate review pending',
                 'explanation':'Substantive description has one editorial home at catalogue_entry. Source-reading scope is recorded per bound source; this is not complete corpus coverage.'})
          source('graded-representations','theory/lineages/h-formalisation/orthing_formalisation_v1.md','Recovery 05: sections 1-3 (scope/representation declaration/typed algebra and finite actualisation), Theorem 4.2, section 5 parity proof, section 11 future-safe quotient and synthesis. Other sections not newly fully read.')
          source('continuation-complete','theory/lineages/h-continuation/continuation_complete_orthing.md','Recovery 05: central contribution/input boundary, finite-law model, Theorem 1 statement and proof, Theorem 2 statement and proof plus its interpretation boundary. No fresh executable or external-source replay.')
          source('modal-grounding','theory/lineages/h-modal/orthability_modal_grounding.md','Recovery 05: opening scope/targets, five modal levels and rotating-witness controls, actual-ancestry Theorem 1 with proof, explanation of premises and countermodels. Not a new assessment of later foundational research.')
          source('last-moat','theory/lineages/h-moat-e3/the_last_moat_e3.tex','Recovery 05: title, abstract, introduction and literal include declarations. Complete root identity bound; no claim of substantive reading of every root section or included component.')
          moatkeys=['last-moat']
          for stem in re.findall(r'^\\input\{([^}]+)\}',(root/'theory/lineages/h-moat-e3/the_last_moat_e3.tex').read_text(),re.M):
              key='last-moat-'+stem.replace('_','-');p='theory/lineages/h-moat-e3/'+stem+'.tex'
              scope='Recovery 05: literal root-include binding and complete byte identity only; not a fresh substantive reading of this component.'
              if stem=='joint_case':scope='Recovery 05: complete state-export counterexample, proposition and proof, and matched-baseline discussion.'
              if stem=='edition3_changes':scope='Recovery 05: complete revision and evidence ledger, mathematical-lineage and proof limits, and account of progress.'
              source(key,p,scope);moatkeys.append(key)
          if len(moatkeys)!=23:raise ValueError('Unexpected component population')
          source('epistemic-tuples','research/t20-v6-20261012/sources/a81201d5cb53b8c6d3d5eaf47abc704286f879cf78579421d6db6e0800fc5255/Epistemic_Tuples_and_Intra_Agential_Equilibrium.txt','Original extraction identity retained; earlier catalogue account and reading companion consulted. Recovery 05 does not claim a fresh complete reading of this extraction or its held PDF.')
          source('epistemic-tuples-reading','research/source-fidelity/epistemic-tuples/README.md','Complete readable companion examined in the preceding continuation; current source identity and work-versus-transcription boundary confirmed. Not a new transcription qualification or PDF release.')
          source('epistemic-tuples-correction','research/t20-v6-20261012/sources/c67c2fa0a538875a2bbbc0df51ad7877a6a701d11cb1567af4f250ff7c2724ad/research.md','Recovery 05: section 5, ET05-A and ET05-B statements/proofs, strict versus nonzero-cone distinction and game/team/constraint boundaries. This source contains other research not fully read in this pass.')
          work('graded-representations','Graded Representations, Witnessed Revision, and Inquiry Landscapes',['graded-representations'],['representation','typed tensor algebra','witnessed revision','avenue 8'],'graded-representations-and-witnessed-revision',['Proposition 3.2','Theorem 4.2','Theorem 5.1','Theorems 11.2-11.3'])
          work('continuation-complete','Continuation-Complete Orthings: Sharp information loss, minimal predictive memory, and safe strategic composition',['continuation-complete'],['predictive information','restoration','avenue 4','avenue 8','avenue 10'],'continuation-complete-information',['Theorem 1','Theorem 2','Interpretation and full-simplex/continuous-coordinate restrictions'])
          work('modal-grounding','Orthability and Necessary Being: Modal support, concrete grounding, and the common-bearer frontier',['modal-grounding'],['modal support','necessary being','avenue 1','avenue 2'],'modal-support-and-necessary-being',['Actual-ancestry Theorem 1','Modal-level distinctions','Countermodels and scope'])
          work('last-moat','The Last Moat, Third Edition: Physical Realisability, Cross-Substrate Communication, and Holarchic Agency',moatkeys,['stateful realisation','continuation','avenue 4','avenue 7','avenue 8'],'stateful-cross-substrate-realisation',['Root introduction','joint_case.tex: export counterexample/proposition','edition3_changes.tex: lineage and evidence limits'])
          work('epistemic-tuples','Epistemic Tuples and Intra-Agential Equilibrium',['epistemic-tuples'],['positive epistemology','cognitive architecture','conditional equilibrium','avenue 3','avenue 6'],'epistemic-profiles-and-intra-agential-equilibrium',['Original sections 1-6: existing catalogue scope','Reading companion: F01-F30 and L0-L7','Separate assessment: section 5 ET05-A/ET05-B'],forms=[{'source':'epistemic-tuples','relationship':'complete-preserved-extraction'},{'source':'epistemic-tuples-reading','relationship':'reading-companion-not-revised-paper'}])
          c['relations'].extend([
           {'from':'graded-representations','to':'continuation-complete','kind':'explicit-stochastic-continuation-extension','basis':'continuation-complete'},
           {'from':'continuation-complete','to':'modal-grounding','kind':'explicit-follow-up-with-distinct-modal-target','basis':'modal-grounding'},
           {'from':'epistemic-tuples','to':'epistemic-tuples-reading','kind':'readable-transcription-companion-not-revised-work','basis':'epistemic-tuples-reading'},
           {'from':'epistemic-tuples','to':'epistemic-tuples-correction','kind':'separate-scientific-assessment-ET05','basis':'epistemic-tuples-correction'},
           *[{'from':k,'to':'last-moat','kind':'included-component-not-separate-work','basis':'last-moat'} for k in moatkeys[1:]]])
          c['scope_note']='Expanding source-to-work crosswalk: representative pilot plus all six mathematical lineage families and the Epistemic Tuples work/reading companion/correction relationship. Not complete C03 coverage; the pilot-stage checker is not a coverage-completion certificate.'
          c['curation_stage']='C03_IN_PROGRESS'
          added=[c['sources'][k]['path'] for k in ['graded-representations','continuation-complete','modal-grounding','last-moat','epistemic-tuples']]
          o['required_work_sources']=sorted(set(o['required_work_sources']+added+[c['sources'][k]['path'] for k in moatkeys[1:]]))
          o['required_work_sources_scope']='Known substantive source and component requirements from inspected baseline owners. This growing subset is not the full candidate denominator; every baseline path remains assigned separately.'
          def append_block(text, ending, entries):
              if text.count(ending)!=1: raise ValueError('Ambiguous block end')
              before,after=text.split(ending)
              return before+',\n'+',\n'.join(entries)+ending+after
          j=lambda x:json.dumps(x,ensure_ascii=False)
          text=original
          old_scope=json.loads(original)['scope_note']
          text=text.replace('  "scope_note": '+j(old_scope)+',','  "scope_note": '+j(c['scope_note'])+',',1)
          text=append_block(text,'\n  },\n  "works": [',['    '+j(k)+': '+j(v) for k,v in c['sources'].items() if k not in old_source_keys])
          text=append_block(text,'\n  ],\n  "relations": [',['    '+j(w) for w in c['works'][old_work_count:]])
          text=append_block(text,'\n  ],\n  "probes": [',['    '+j(r) for r in c['relations'][old_relation_count:]])
          if not text.endswith('\n}\n'):raise ValueError('Unexpected JSON end')
          text=text[:-3]+',\n  "curation_stage": "C03_IN_PROGRESS"\n}\n'
          if json.loads(text)!=c:raise ValueError('Rendered object differs')
          (d/'CROSSWALK.json').write_text(text)
          (d/'OWNER-MAP.json').write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n')
          with (d/'RECOVERY-04.md').open('a') as f:
              f.write('\n\n## Resumption 05 — saved manuscript additions reconciled\n\nOn 13 October 2026 the live branch was recovered at `32440aad4db897be5b8ef2fb7086a6f7a87f4cd4`, tree `1f1e0873752ae9125fb5cfd22d7632e61f1b0806`. The source-only incremental transport was verified against the preserved public-history bundle; all five increment member hashes matched. The recovered checkout includes merged main `0784acddd4770f1190f758f264ba52b2b110bd27` and all fifty saved implementation-history commits. No original archive was changed. Full Git recovery is not source reading.\n\nThe earlier fixture-root repair and exact-main reconciliation were already present and were not repeated. Fresh local execution passed 57 pilot tests and the actual reader-binding check. Hygiene identified a stale manifest entry for the last saved catalogue edit; current-state drift was also present. This is interrupted checkpoint maintenance, not a weakened gate or a reason to discard the catalogue.\n\nThe saved catalogue\'s five additional families were not yet represented in CROSSWALK. This continuation binds them explicitly: graded representations; continuation-complete information; modal support; the single componentised Last Moat manuscript; and Epistemic Tuples with its readable companion and separate ET05 assessment. The map now has 24 work entries and 62 bound sources, including the Last Moat root plus all 22 literal TeX includes. Component bytes are identity-bound; only the root introduction, complete export-counterexample component and complete revision/evidence ledger received the substantive reading stated in their source records. The other components are not falsely credited as read.\n\nFor the mathematical additions, the actual readings include the graded draft\'s representation/typed-algebra definitions, Proposition 3.2, target-fibre and parity proofs, and future-safe quotient/synthesis statements; the continuation supplement\'s finite-law model and Theorems 1–2 with their proof/interpretation boundaries; the modal supplement\'s level distinctions and actual-ancestry theorem with its premises and controls; and ET05\'s strict-cone distinction and finite scalarisation proofs. The original Epistemic Tuples binary was not inspected or released. The prior companion/extraction reading scope is retained rather than counted again. Scientific status owners and original proofs are unchanged.\n\nThe real crosswalk/source/page check passed after those bindings. Adding the known manuscript and included-component paths to OWNER-MAP\'s required source subset makes a dropped newly mapped work fail, while the independent full-tree candidate denominator remains separate. The existing catalogue remains the editorial home for these descriptions. The complete corpus, remaining tranche works, applications, root-navigation consolidation, full maintenance controls and independent review remain outstanding; no C03 closure is claimed.\n')
          print('Bound',len(c['works']),'works and',len(c['sources']),'sources')
          PY
          git rm -- .github/workflows/reader-refactor-snapshot.yml
          git add -- docs/project-closure/reader-refactor-issue-35/CROSSWALK.json docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json docs/project-closure/reader-refactor-issue-35/RECOVERY-04.md
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = 9703e30953f2938e0382b330dc01d46a9eca926b
      - name: Observe pinned-environment checks on the exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/pilot.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/pilot-optimized.txt"
          python -B scripts/check_reader_pilot.py | tee "$EVIDENCE_DIR/reader-bindings.txt"
          python -B scripts/generate_current_state.py --check | tee "$EVIDENCE_DIR/state-drift.txt"
          python -B scripts/validate_repo.py | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_review_state.py | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py | tee "$EVIDENCE_DIR/references.txt"
          test "$(git write-tree)" = 9703e30953f2938e0382b330dc01d46a9eca926b
      - name: Save only the tested tree to the same feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: bind five recovered work families and their source components'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/tree.txt"
          git update-ref refs/heads/issue35-checkpoint HEAD
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" refs/heads/issue35-checkpoint '^027be47c7426e1e52da640ac0066f85de4fe5892'
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Retain exact checkpoint evidence; not full CI or independent acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-curation05-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-curation05/
          retention-days: 14
          if-no-files-found: error

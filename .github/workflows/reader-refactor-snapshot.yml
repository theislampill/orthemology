name: issue35 historical contributor repair qualification
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - run: pip install --quiet -r requirements-ci.lock.txt
      - name: Recover exact payload from immutable transport object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b6f72dd1cff930f51bb65dae0b443db8719643b1
          mkdir -p "$RUNNER_TEMP/issue35-binding"
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, zlib
          sha = '2810bafd7d676a0b012adbb0318e8fe66b9408b7'
          result = json.loads(subprocess.check_output(['gh', 'api', 'repos/theislampill/orthemology/git/blobs/' + sha]))
          body = base64.b64decode(result['content'])
          if hashlib.sha1(b'blob ' + str(len(body)).encode() + b'\0' + body).hexdigest() != sha:
              raise SystemExit('transport Git blob mismatch')
          matches = re.findall(r"^          encoded = '([A-Za-z0-9+/=]+)'$", body.decode(), re.M)
          if len(matches) != 1:
              raise SystemExit('ambiguous transport payload')
          # Correct a diagnosed uncommitted transport transcription, never an expected hash.
          encoded = matches[0].replace('FEVXSFLUlalb2RU', 'FEVXSFLUalb2RU', 1)
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest() != 'b396c7544cf7ee1db1457f8479362364668affbad4d43ee6c0633ff80ee8d33b':
              raise SystemExit('transport identity mismatch')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-binding/payload.json').write_bytes(raw)
          print('Original locally tested payload identity verified')
          PY
      - name: Reproduce exact production failure before applying repair
        run: |
          set -euo pipefail
          set +e
          python -B tests/test_t20_v6_projection.py CompleteValidationTests.test_current_public_tree_passes_complete_validation > "$RUNNER_TEMP/issue35-binding/red.log" 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -q '5e00b728e533c019b656032a86b5427f820d281056c40d78df0d0cf2c1549bc1: public' "$RUNNER_TEMP/issue35-binding/red.log"
          grep -q 'false byte' "$RUNNER_TEMP/issue35-binding/red.log"
          grep -q 'FAILED (failures=1)' "$RUNNER_TEMP/issue35-binding/red.log"
      - name: Apply hash-guarded repair and regenerate existing outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-binding'
          p = json.loads((out / 'payload.json').read_bytes())
          subprocess.run(['git', 'apply', '--check', '-'], input=p['patch'].encode(), check=True)
          subprocess.run(['git', 'apply', '-'], input=p['patch'].encode(), check=True)
          for name, expected in p['sha256'].items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('changed file does not match tested payload: ' + name)
          pathlib.Path('.github/workflows/reader-refactor-snapshot.yml').unlink()
          subprocess.run(['git', 'add', '-u'], check=True)
          subprocess.run(['python', '-B', 'scripts/generate_current_state.py'], check=True)
          subprocess.run(['python', '-B', 'scripts/make_manifest.py'], check=True)
          subprocess.run(['git', 'add', 'docs/current-state.yaml', 'docs/provenance/RELEASE-MANIFEST.sha256'], check=True)
          allowed = set(p['sha256']) | {'docs/current-state.yaml', 'docs/provenance/RELEASE-MANIFEST.sha256'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', p['base']], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('exact write-set mismatch: ' + repr(sorted(changed ^ allowed)))
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          (out / 'identity.json').write_text(json.dumps({'base': p['base'], 'tree': tree, 'transport_head': os.environ['GITHUB_SHA'], 'scope': 'native source-binding repair; full normal CI and independent review remain separate'}, indent=2) + '\n')
          (out / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary', p['base']]))
          print('Prepared exact repair tree', tree)
          PY
      - name: Production projection and strict reader regression tests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-binding"
          python -B tests/test_t20_v6_projection.py 2>&1 | tee "$out/projection.log"
          python -B -O tests/test_t20_v6_projection.py 2>&1 | tee "$out/projection-optimized.log"
          python -B tests/test_reader_pilot.py HistoricalMetadataPinTests RootNavigationAndMaintenanceTests 2>&1 | tee "$out/reader-repair.log"
          python -B -O tests/test_reader_pilot.py HistoricalMetadataPinTests RootNavigationAndMaintenanceTests 2>&1 | tee "$out/reader-repair-optimized.log"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$out/reader-bindings.log"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$out/projection-check.log"
      - name: Existing preservation, generated-state and reference gates
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-binding"
          python scripts/generate_current_state.py --check 2>&1 | tee "$out/drift.log"
          python scripts/validate_repo.py 2>&1 | tee "$out/hygiene.log"
          python scripts/validate_current_state.py 2>&1 | tee "$out/state.log"
          python scripts/validate_review_state.py 2>&1 | tee "$out/review-state.log"
          python scripts/validate_internal_references.py 2>&1 | tee "$out/references.log"
          before=$(git write-tree)
          python scripts/generate_current_state.py
          python scripts/make_manifest.py
          git add docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = "$before"
      - name: Export tested Git objects only; never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-binding'
          p = json.loads((out / 'payload.json').read_bytes())
          identity = json.loads((out / 'identity.json').read_bytes())
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != identity['tree']:
              raise SystemExit('tested tree changed')
          repo = 'repos/theislampill/orthemology'
          def api(endpoint, data):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', repo + endpoint, '--input', '-'], input=json.dumps(data).encode()))
          paths = sorted(set(p['sha256']) | {'docs/current-state.yaml', 'docs/provenance/RELEASE-MANIFEST.sha256'})
          elements = []
          for path in paths:
              body = pathlib.Path(path).read_bytes()
              result = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(body).decode()})
              local = hashlib.sha1(b'blob ' + str(len(body)).encode() + b'\0' + body).hexdigest()
              if result['sha'] != local:
                  raise SystemExit('uploaded blob mismatch')
              elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': local})
          result = api('/git/trees', {'base_tree': p['base_tree'], 'tree': elements})
          if result['sha'] != identity['tree']:
              raise SystemExit('uploaded tree mismatch')
          (out / 'uploaded-tree.json').write_text(json.dumps({'tree': result['sha'], 'files': paths, 'remote_ref_moved': False}, indent=2) + '\n')
          lines = []
          for path in sorted(out.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS':
                  lines.append(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name)
          (out / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
          print('Exact tested Git tree exported without moving a remote ref:', result['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue35-historical-contributor-repair
          path: ${{ runner.temp }}/issue35-binding/
          retention-days: 14

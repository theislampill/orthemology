    identity: PMR-007-R5CU-1
    central_change: One common finite model composes underived-order placeholders,
      a stipulated necessary abstract order, an externally actual impersonal realizer,
      formal coupling, exact norm potential, articulability, token responsiveness,
      and plural W/P/K role availability while withholding personality, Wisdom, Speech,
      source truth, and a common-bearer Creator.
  DEEP_S:
    identity: PMR-007-SCRF-1
    central_change: H12/H16 source predicates conditionally filter the frozen Track-N
      rival class, but the filter neither authenticates the source nor migrates into
      neutral Track T.
  DEEP_T:
    identity: PMR-007-MACC-1
    central_change: Current merged-main and Deep O-S evidence still do not select
      a unique integrated architecture; this is an authority reconciliation and application
      of Deep E/S and the fibre family, not a new theorem origin.
  DEEP_U:
    identity: PMR-007-TRPD-1
    central_change: Longitudinal trajectory signatures can split an endpoint-equivalent
      model fibre and encoding can be load-bearing, but endpoint-plus-trajectory evidence
      still does not identify one mechanism, subject, proper function, or metaphysical
      ground.
  DEEP_V:
    identity: PMR-007-SWPC-1
    central_change: Profile certifiability, frozen-root warrant completeness, and
      independently supplied world-target adequacy form three separately variable
      coordinates. The profile/warrant pair has a coarsest exact four-state diagnostic,
      but the mixed failures are Pareto-incomparable and no axis-neutral strict priority
      follows.
  DEEP_W:
    identity: PMR-007-TIPC-1
    central_change: A finite target-indexed pullback aligns independently valid profile,
      warrant, and world-bridge objects only when their full declared target/version/scope/analysis/referent/semantic-contract
      key agrees. Compatibility does not validate any component, authorize the key,
      establish source or world truth, or create one bearer.

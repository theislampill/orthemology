candidate_claims:
  TIPC_1: valid profile and warrant objects are integrable exactly when their full
    contract keys agree
  TIPC_2: every finite compatible cone factors uniquely through the valid pullback
  TIPC_3: a valid three-way pullback aligns profile, warrant, and world bridge objects
    to one full contract key
  TIPC_4: pullback membership does not entail target authority, world truth, bearer
    identity, or source authentication

name: issue-35-fifteenth-checkpoint-corrected

# Correct only the same-step evidence-directory setup in the pinned publisher.
# Reuse its already hash-verified patch, unchanged tests, expected tree and lease.
# This helper removes itself; no science, required gate or expected tree changes.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-fifteenth-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the unchanged tested patch with corrected evidence setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e4889c22f15ad66f3f5999e936f528abfa2ff924
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          export EVIDENCE_DIR="$RUNNER_TEMP/issue35-fifteenth"
          mkdir -p "$EVIDENCE_DIR"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, subprocess, yaml
          revision = 'e4889c22f15ad66f3f5999e936f528abfa2ff924'
          raw = subprocess.check_output(['git', 'show', revision + ':.github/workflows/reader-refactor-snapshot.yml'])
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if actual != '0c3dd1c49cd3df8791ed368266bf69ab3b3d1026':
              raise SystemExit('Original publisher identity differs')
          steps = yaml.safe_load(raw)['jobs']['checkpoint']['steps']
          selected = [s['run'] for s in steps if s.get('name') == 'Apply the exact tested Fifteenth curation patch']
          if len(selected) != 1:
              raise SystemExit('Original apply step is ambiguous')
          old = 'test "$(git rev-parse HEAD^)" = f59c61c6ab1b038a8836cd44841427199ad2c927'
          new = 'test "$(git rev-parse HEAD^)" = e4889c22f15ad66f3f5999e936f528abfa2ff924'
          if selected[0].count(old) != 1:
              raise SystemExit('Original parent guard is missing')
          subprocess.run(['bash', '-c', selected[0].replace(old, new, 1)], check=True)
          PY
      - name: Run the original qualification commands unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, yaml
          raw = subprocess.check_output(['git', 'show', 'e4889c22f15ad66f3f5999e936f528abfa2ff924:.github/workflows/reader-refactor-snapshot.yml'])
          steps = yaml.safe_load(raw)['jobs']['checkpoint']['steps']
          selected = [s['run'] for s in steps if s.get('name') == 'Qualify the exact Fifteenth curation tree']
          if len(selected) != 1:
              raise SystemExit('Original qualification step is ambiguous')
          subprocess.run(['bash', '-c', selected[0]], check=True)
          PY
      - name: Publish the originally bounded exact-tree checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, yaml
          raw = subprocess.check_output(['git', 'show', 'e4889c22f15ad66f3f5999e936f528abfa2ff924:.github/workflows/reader-refactor-snapshot.yml'])
          steps = yaml.safe_load(raw)['jobs']['checkpoint']['steps']
          selected = [s['run'] for s in steps if s.get('name') == 'Save only the exact checked feature tree']
          if len(selected) != 1:
              raise SystemExit('Original publication step is ambiguous')
          subprocess.run(['bash', '-c', selected[0]], check=True)
          PY
      - name: Preserve observed evidence without claiming full PR acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-fifteenth-checkpoint-corrected-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-fifteenth/
          retention-days: 14
          if-no-files-found: error

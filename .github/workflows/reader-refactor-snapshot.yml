name: issue-35-geometry-checkpoint
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install existing locked dependencies
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply only the exact source-preserving curation
        shell: bash
        run: |
          set -euo pipefail
          base=26aef41055a0a03451add1691f6cd9305bce89c1
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 0784acddd4770f1190f758f264ba52b2b110bd27
          test -z "$(git status --porcelain)"
          export EVIDENCE_DIR="$RUNNER_TEMP/issue35-geometry"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          import yaml
          payload = '''
          
          
          '''
          packed = base64.b64decode(''.join(payload.split()), validate=True)
          if len(packed) != 16444 or hashlib.sha256(packed).hexdigest() != '504cf7f751bc8c5a75a7c5d467ea6a88be9d1402cad3e36c063f5b2d96ca3e80':
              raise SystemExit('Compressed patch mismatch')
          patch = lzma.decompress(packed)
          if len(patch) != 69315 or hashlib.sha256(patch).hexdigest() != '6786c7604b5d15f2710061c2ad72f8fcc8952aa0e6ffd73fbc9e7157c13a5056':
              raise SystemExit('Patch mismatch')
          out = Path(os.environ['EVIDENCE_DIR'])
          (out/'authored.patch').write_bytes(patch)
          state = Path('docs/current-state.yaml')
          authored = yaml.safe_load(state.read_text())['authored']
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero',str(out/'authored.patch')],check=True)
          if yaml.safe_load(state.read_text())['authored'] != authored:
              raise SystemExit('Authored state changed')
          allowed = {
              'docs/current-state.yaml',
              'docs/project-closure/reader-refactor-issue-35/COLLECTION-COVERAGE.md',
              'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json',
              'docs/project-closure/reader-refactor-issue-35/PROGRESS.md',
              'docs/provenance/RELEASE-MANIFEST.sha256',
              'docs/reader/APPLICATIONS.md','docs/reader/CURRENT-FRONTIERS.md',
              'docs/reader/PAPER-CATALOGUE.md','docs/reader/RESEARCH-ATLAS.md',
              'docs/reader/RESULT-INDEX.md','docs/reader/VERIFICATION-GUIDE.md',
              'tests/test_reader_pilot.py',
          }
          paths = set(subprocess.check_output(['git','diff','--cached','--name-only','26aef41055a0a03451add1691f6cd9305bce89c1']).decode().splitlines())
          if paths != allowed:
              raise SystemExit('Unexpected writes: '+repr(sorted(paths)))
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          if tree != 'd12f1fa9e1dcd69d3fccd181302693d08e42c88c':
              raise SystemExit('Candidate tree mismatch: '+tree)
          (out/'tested-tree.txt').write_text(tree+'\n')
          print('PASS: exact source-preserving twelve-file candidate')
          PY
          git diff --exit-code
      - name: Qualify the actual catalogue and unchanged integration contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-optimized.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/references.txt"
      - name: Save the checked checkpoint without changing original science
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = d12f1fa9e1dcd69d3fccd181302693d08e42c88c
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: explain continuation repair geometry and constructive information access'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/tree.txt"
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" HEAD ^26aef41055a0a03451add1691f6cd9305bce89c1
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Retain actual checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-geometry-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-geometry/
          retention-days: 14
          if-no-files-found: error

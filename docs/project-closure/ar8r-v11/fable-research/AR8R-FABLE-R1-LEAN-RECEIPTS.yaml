      beforeAfter_not_certifiable, matched_separates_twin,
      matched_certifies_twin), which is strictly stronger.

what_this_does_not_establish:
  - The historical T299 packet is not machine-checked end to end. What is
    checked is a repaired, scoped interpretation of it.
  - The mathematics is not novel. The characterization is the quotient
    factorization lemma; a kernel check does not create novelty.
  - No other theorem in the program is machine-checked. Q1a through Q1i remain
    unperformed.
  - The external Lean corpus referenced by the formalization queue
    (230 declaration records over 48 scanned files) is still STATIC_ONLY. It was
    not parsed, elaborated, or kernel-checked here, and this receipt makes no
    claim about it.
  - Machine checking establishes only that the formalized statements follow from
    Lean's axioms. It does not establish that the formalization faithfully
    renders the informal packet; the specification defects recorded in
    AR8R-FABLE-R1-T299-SPECIFICATION-DEFECTS.md are precisely the places where
    faithfulness required a choice.
  - No empirical, metaphysical, theological, adoption, champion, meniscus, or
    closure status changes.

ci_decision_required:
  id: FABLE-R1-CI-01
  status: OPEN_OWNER_OR_MAINTAINER_DECISION
  statement: >
    The repository CI installs from a pinned lockfile and advertises no live web
    checks. A mathlib build requires a multi-gigabyte network fetch. Adding a
    Lean job to CI therefore conflicts with the current CI contract. Options:
    (a) leave Lean out of CI and treat these receipts as local-only evidence;
    (b) add a cached, pinned Lean job and amend the CI contract explicitly;
    (c) vendor nothing and re-verify on demand. No option is taken here.

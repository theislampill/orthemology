common_decoder:
  id: common_profile_decoder_v1
  version: 1.0.0
  input_contract: architecture-specific raw fixture response
  output_fields:
  - action_bit
  - certificate_match
  - authority_handling
  - root_count_bin
  - latency_bin
  - timeout
  - trajectory_digest
  forbidden_input_fields:
  - architecture
  - target_coordinate
  - personal
  - impersonal
  - plural
  - intentional_uptake
  - one_bearer
  - source_world_truth
  target_independence: decoder source and configuration are identical for all architecture
    witnesses
  semantics_preservation_test: canonical decoded profile equality under declared content-preserving
    encodings
policy_registry:
  id: candidate_independent_policy_registry_v1
  version: 1.0.0
  policies:
  - lexicographic_complete_enumeration
  - history_hash_branching
  allowed_inputs:
  - prior_common_outputs
  - registered_cell_id
  - public_nonce
  forbidden_inputs:
  - architecture
  - target_coordinate
  - private_internal_role
  - source_world_truth
  horizon: 2

name: issue-35-seventh-works
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the unchanged dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact source-bound Seventh work curation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue35-seventh"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/issue35-seventh" >> "$GITHUB_ENV"
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path
          import yaml
          base='9c01c4eb7613c2dbb3cc3d6b9d9c7ac77ee0d4f0'
          expected='0e56ee603db0d0cdcc4c41c1aae9d70964dce4f8'
          def git(*a): return subprocess.check_output(['git',*a]).decode().strip()
          if git('rev-parse','HEAD^')!=base or git('rev-parse','HEAD')!=os.environ['GITHUB_SHA'] or git('status','--porcelain'):
              raise SystemExit('Transport ancestry or clean-checkout mismatch')
          chunks=[]
          for oid in ['2070ab942684dca09b63a0e7568f54cb7ec4c5fb']:
              req=urllib.request.Request('https://api.github.com/repos/theislampill/orthemology/git/blobs/'+oid,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
              body=base64.b64decode(data['content'])
              if data['sha']!=oid or hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()!=oid:
                  raise SystemExit('Transport blob identity mismatch')
              chunks.append(body)
          raw=lzma.decompress(b''.join(chunks))
          if hashlib.sha256(raw).hexdigest()!='e6924b5f49dd9e7470bdc6ea57b4ab71cac7478759f6b644d35bf37523ffaf49':
              raise SystemExit('Transport identity mismatch')
          data=json.loads(raw)
          if data['format']!='issue35-exact-patch-v1':raise SystemExit('Unknown transport')
          out=Path(os.environ['RUNNER_TEMP'])/'issue35-seventh'
          (out/'authored-transport.json').write_bytes(raw)
          before=yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']
          subprocess.run(['git','apply','--index','--unidiff-zero'],input=data['patch'].encode(),check=True)
          for p,h in data['expected_files'].items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h:raise SystemExit('Authored bytes differ: '+p)
          subprocess.run(['git','add','--',*data['expected_files']],check=True)
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['python','-B','scripts/generate_current_state.py'],check=True)
          if yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']!=before:raise SystemExit('Authored state changed')
          subprocess.run(['python','-B','scripts/make_manifest.py'],check=True)
          subprocess.run(['git','add','--','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'],check=True)
          allowed=set(data['expected_files'])|{'docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'}
          if set(git('diff',base,'--name-only').splitlines())!=allowed:raise SystemExit('Unexpected write scope')
          if git('write-tree')!=expected:raise SystemExit('Local/native tree mismatch')
          (out/'candidate.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':expected,'source_base':data['source_base'],'authored_files':sorted(data['expected_files'])},indent=2)+'\n')
          print('Exact Seventh tree:',expected)
          PY
      - name: Check the actual candidate without changing scientific evidence
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/references.txt"
      - name: Upload only verified content objects for the connector commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,base64,subprocess,urllib.request
          from pathlib import Path
          out=Path(os.environ['EVIDENCE_DIR']);candidate=json.loads((out/'candidate.json').read_text())
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          if git('write-tree')!=candidate['tree']:raise SystemExit('Candidate changed after checks')
          api='https://api.github.com/repos/theislampill/orthemology'
          def request(path,data=None):
              req=urllib.request.Request(api+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          if request('/git/ref/heads/refactor/issue-35-research-reader-20261012')['object']['sha']!=os.environ['GITHUB_SHA']:
              raise SystemExit('Remote head advanced; retain candidate without branch publication')
          elements=[]
          paths=candidate['authored_files']+['docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256']
          for p in paths:
              oid=request('/git/blobs',{'content':base64.b64encode(Path(p).read_bytes()).decode(),'encoding':'base64'})['sha']
              mode,want,_=git('ls-files','-s','--',p).split(None,2)
              if oid!=want:raise SystemExit('Uploaded file identity differs: '+p)
              elements.append({'path':p,'mode':mode,'type':'blob','sha':oid})
          elements.append({'path':'.github/workflows/reader-refactor-snapshot.yml','mode':'100644','type':'blob','sha':None})
          actual=request('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':elements})['sha']
          if actual!=candidate['tree']:raise SystemExit('Uploaded tree identity differs')
          (out/'uploaded-tree.json').write_text(json.dumps({'tree':actual,'parent':os.environ['GITHUB_SHA'],'branch_advanced':False},indent=2)+'\n')
          print('Verified tree uploaded; no branch, merge or release mutation:',actual)
          PY
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-seventh-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-seventh/
          retention-days: 14
          if-no-files-found: error

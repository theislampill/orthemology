name: issue-35-twentieth-formal
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the unchanged dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Restore the exact locally tested reader change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue35-twentieth-formal"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/issue35-twentieth-formal" >> "$GITHUB_ENV"
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess,urllib.request
          from pathlib import Path
          import yaml
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          base='560a416255b45640d9bd108f0c006a1a8097fbc5'
          expected='7ce8214875dd56cb3d5550256fb9adacfcd1953b'
          if git('rev-parse','HEAD^')!='31470a4b9ced03e1f8f3f5932a64b3013563ba79' or git('rev-parse','HEAD^^')!=base or git('rev-parse','HEAD')!=os.environ['GITHUB_SHA'] or git('status','--porcelain'):
              raise SystemExit('Transport ancestry or checkout changed')
          oid='9e647dc073073dfe836fcc4144938a7cdecd51cd'
          req=urllib.request.Request('https://api.github.com/repos/theislampill/orthemology/git/blobs/'+oid,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=45) as r:data=json.load(r)
          compressed=base64.b64decode(data['content'])
          if data['sha']!=oid or hashlib.sha1(b'blob '+str(len(compressed)).encode()+b'\0'+compressed).hexdigest()!=oid:raise SystemExit('Wrong transport blob')
          raw=lzma.decompress(compressed)
          if hashlib.sha256(raw).hexdigest()!='a744f1d16b7913d0bcfa5d2a35158a6dab1677b567c9cc671ac682f2f92f1c46':raise SystemExit('Transport hash differs')
          data=json.loads(raw)
          if data['format']!='issue35-exact-patch-with-source-fill-v1' or data['base']!=base or data['tree']!=expected:raise SystemExit('Unexpected patch contract')
          out=Path(os.environ['RUNNER_TEMP'])/'issue35-twentieth-formal'
          (out/'authored-transport.json').write_bytes(raw)
          before=yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']
          subprocess.run(['git','apply','--index','--recount','--unidiff-zero'],input=data['patch'].encode(),check=True)
          fill=data['source_fill'];path=Path('docs/project-closure/reader-refactor-issue-35/CROSSWALK.json');text=path.read_text()
          # Replacing 134 source lines by a transport marker moved a zero-context
          # insertion. Restore only these seven exact new rows to their tested
          # position. The original expected content hash below stays unchanged.
          order=['t20-church-probe','t20-scalar-fusion','t20-hase-negative-routes','t20-cnd-scope','t20-modal-union','t20-ground-extension','t20-grounded-support']
          moved={};kept=[]
          for line in text.splitlines(keepends=True):
              if line.startswith('    {"key": '):
                  key=json.loads(line.strip().rstrip(','))['key']
                  if key in order:
                      if key in moved:raise SystemExit('Duplicate transported work')
                      moved[key]=line
                      continue
              kept.append(line)
          if set(moved)!=set(order):raise SystemExit('Missing transported work')
          text=''.join(kept).replace('  "works": [\n','  "works": [\n'+''.join(moved[k] for k in order),1)
          cross=json.loads(text);existing={v['path'] for k,v in cross['sources'].items() if k!='__ISSUE35_T20_SOURCE_FILL__'}
          selected=json.loads(Path(fill['index']).read_text())['selected_sources'];added={}
          for component,primary in fill['components'].items():
              for source in selected:
                  p=source['public_path']
                  if source['component']!=component or p in existing:continue
                  if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=source['public_sha256']:raise SystemExit('Original source changed')
                  key='t20-source-'+hashlib.sha256(p.encode()).hexdigest()[:16]
                  if key in cross['sources'] or key in added:raise SystemExit('Source key collision')
                  added[key]={'path':p,'sha256':source['public_sha256'],'read_scope':fill['read_scope'] if source['logical_path'] in primary else fill['support_scope']}
                  existing.add(p)
          marker='    "__ISSUE35_T20_SOURCE_FILL__": {},\n'
          if len(added)!=fill['count'] or text.count(marker)!=1:raise SystemExit('Source fill population differs')
          insertion=''.join('    '+json.dumps(k)+': '+json.dumps(v,ensure_ascii=False,separators=(',',': '))+',\n' for k,v in added.items())
          path.write_text(text.replace(marker,insertion))
          for p,h in data['expected_files'].items():
              if hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h:raise SystemExit('Authored bytes differ: '+p)
          subprocess.run(['git','add','--',*data['expected_files']],check=True)
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['python','-B','scripts/generate_current_state.py'],check=True)
          if yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']!=before:raise SystemExit('Authored state changed')
          subprocess.run(['python','-B','scripts/make_manifest.py'],check=True)
          subprocess.run(['git','add','--','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'],check=True)
          allowed=set(data['expected_files'])|{'docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256','.github/workflows/reader-refactor-snapshot.yml'}
          if set(git('diff',base,'--name-only').splitlines())!=allowed or git('write-tree')!=expected:raise SystemExit('Write set or tested tree differs')
          (out/'candidate.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':expected,'source_base':data['source_base'],'authored_files':sorted(data['expected_files'])},indent=2)+'\n')
          print('Exact source-preserving tree:',expected)
          PY
      - name: Observe reader checks and existing integration contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-optimized.txt"
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/bindings.txt"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$EVIDENCE_DIR/drift.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE_DIR/review.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE_DIR/references.txt"
      - name: Upload checked objects without advancing the branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json,base64,subprocess,urllib.request
          from pathlib import Path
          out=Path(os.environ['EVIDENCE_DIR']);candidate=json.loads((out/'candidate.json').read_text())
          def git(*a):return subprocess.check_output(['git',*a]).decode().strip()
          def request(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/theislampill/orthemology'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          if git('write-tree')!=candidate['tree']:raise SystemExit('Candidate drift')
          if request('/git/ref/heads/refactor/issue-35-research-reader-20261012')['object']['sha']!=os.environ['GITHUB_SHA']:raise SystemExit('Remote head advanced')
          elements=[]
          for p in candidate['authored_files']+['docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256']:
              oid=request('/git/blobs',{'content':base64.b64encode(Path(p).read_bytes()).decode(),'encoding':'base64'})['sha']
              mode,want,_=git('ls-files','-s','--',p).split(None,2)
              if oid!=want:raise SystemExit('Uploaded blob differs: '+p)
              elements.append({'path':p,'mode':mode,'type':'blob','sha':oid})
          elements.append({'path':'.github/workflows/reader-refactor-snapshot.yml','mode':'100644','type':'blob','sha':None})
          actual=request('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':elements})['sha']
          if actual!=candidate['tree']:raise SystemExit('Uploaded tree differs')
          (out/'uploaded-tree.json').write_text(json.dumps({'tree':actual,'parent':os.environ['GITHUB_SHA'],'branch_advanced':False},indent=2)+'\n')
          print('Exact tested objects uploaded; connector publication still required:',actual)
          PY
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-twentieth-formal-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-twentieth-formal/
          retention-days: 14
          if-no-files-found: error

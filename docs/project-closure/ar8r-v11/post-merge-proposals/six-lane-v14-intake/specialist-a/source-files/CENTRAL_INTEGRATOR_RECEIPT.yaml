primary_synthesis:
- A common decoder across rival implementations exists exactly when the frozen target
  is constant on cross-architecture common-profile fibres; local decoders do not suffice.
- Eligible factor selection is exact set cover over residual cross-target collision
  pairs; failure of the all-factor union gives only a declared-family/manifest no-cover
  result.
- Every finite causal kernel has a complete-history realiser with the same adaptive-policy
  profile; architecture nonidentifiability follows only under an independently warranted
  target-different class-closure premise.
- Canonical history state count is an upper bound. The depth-specific predictive quotient
  is the semantics-invariant correction and exact deterministic state minimum under
  the frozen interface.
- Profile-derived factors have zero collision gain; target leaks may have maximal
  gain but remain ineligible; weak eligible factors can be complementary.
anti_unification_receipts:
- R7 and R9 are the existing T294/Deep-BV finite fibre family under representation/tagged-union
  vocabulary; no new theorem identities.
- R4 is a partial-observation specialization of the existing finite co-Büchi/game
  family; no new fixed-point mechanism.
- R10 is standard finite set cover; R11/R12 have standard behavioural/Myhill-Nerode
  ancestry expected and await durable locators.
- Common knowledge, provenance roots, proper function, source-world truth, personality,
  and metaphysical architecture remain distinct coordinates.

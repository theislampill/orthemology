name: issue-35-curation-checkpoint-05

# Temporary exact-tree publisher for the owner-authorised feature branch.
# Only the five named documentation/generated files and helper removal may change.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-curation-checkpoint-05
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install existing locked dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements-ci.lock.txt
      - name: Apply exact tested patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 2d8d76228a4f0c5377e1d7abbd544d0e63062552
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-curation05"
          printf 'EVIDENCE_DIR=%s/issue35-curation05\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          data = '''eNrtfdlyHMmR4Du/Ig160K6xEojIuDLIl6EottQ23U0a2Vrt2thYdZxAqgtVpcwskljZmM0/7HzhfMm4Rx6VdaFAcsQWVjK1QBQqI8LDb49w9/RVjFmeX1dtZq78yjVXblPXYdnmTWvacHlnbheZPfXNk2lrp...'''
          PY

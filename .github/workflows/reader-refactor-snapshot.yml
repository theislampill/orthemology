name: issue-35-twelfth-checkpoint

# Temporary owner-authorised transport of the exact locally tested, nine-file
# editorial/test patch. Its compressed representation is checked before decoding;
# the resulting patch and final Git tree are checked independently. Original
# research is not edited. This workflow removes itself before publication.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-twelfth-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install the existing dependency lock
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the exact tested curation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3f38026f6f8e8542ff921db61381dd1afdb3c5e4
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-twelfth"
          printf 'EVIDENCE_DIR=%s/issue35-twelfth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'issue35-twelfth'
          (out/'transfer.txt').write_text('Nine-file author-prepared curation/test patch; original sources protected.\n')
          payload = '''
          
          
          
          '''
          packed = base64.b64decode(''.join(payload.split()), validate=True)
          if len(packed) != 16500 or hashlib.sha256(packed).hexdigest() != 'd674e594636e95fd7c2e1c22a8c455341d6385c6e7f5e19552387cc23d478621':
              raise SystemExit('Compressed patch identity mismatch')
          patch = lzma.decompress(packed)
          if len(patch) != 67489 or hashlib.sha256(patch).hexdigest() != '6f83419bb8c6dbde94090c6d66407e9a4270a65a0c92d4e24339252ef6d91131':
              raise SystemExit('Patch identity mismatch')
          p = out/'authored.patch'
          p.write_bytes(patch)
          subprocess.run(['git','rm','--','.github/workflows/reader-refactor-snapshot.yml'],check=True)
          subprocess.run(['git','apply','--index','--binary','--unidiff-zero',str(p)],check=True)
          allowed = {
              'docs/project-closure/reader-refactor-issue-35/CROSSWALK.json',
              'docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json',
              'docs/project-closure/reader-refactor-issue-35/RECOVERY-04.md',
              'docs/reader/APPLICATIONS.md', 'docs/reader/CURRENT-FRONTIERS.md',
              'docs/reader/PAPER-CATALOGUE.md', 'docs/reader/RESEARCH-ATLAS.md',
              'docs/reader/RESULT-INDEX.md', 'tests/test_reader_pilot.py',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only','3f38026f6f8e8542ff921db61381dd1afdb3c5e4']).decode().splitlines())
          if actual != allowed:
              raise SystemExit('Unexpected authored write set: '+repr(sorted(actual)))
          print('PASS: exact nine-file source-read curation patch')
          PY
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = 5615e0394042e41120c9e2cc66f1cdf99a861d04
          git diff --exit-code
      - name: Qualify the exact curation tree
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE_DIR/census.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-tests.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE_DIR/reader-tests-opt.txt"
          python -B scripts/check_reader_pilot.py | tee "$EVIDENCE_DIR/reader-bindings.txt"
          python -B scripts/validate_t20_v6_projection.py | tee "$EVIDENCE_DIR/projection.txt"
          python -B scripts/generate_current_state.py --check | tee "$EVIDENCE_DIR/state.txt"
          python -B scripts/validate_repo.py | tee "$EVIDENCE_DIR/hygiene.txt"
          python -B scripts/validate_review_state.py | tee "$EVIDENCE_DIR/review-state.txt"
          python -B scripts/validate_internal_references.py | tee "$EVIDENCE_DIR/references.txt"
          git diff --cached --check
      - name: Save only the exact checked feature tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 5615e0394042e41120c9e2cc66f1cdf99a861d04
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: curate all nine Twelfth works with source-bound reading and omission controls'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$EVIDENCE_DIR/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE_DIR/tree.txt"
          git update-ref refs/heads/issue35-twelfth-checkpoint HEAD
          git bundle create "$EVIDENCE_DIR/checkpoint.bundle" refs/heads/issue35-twelfth-checkpoint ^ef2339b5d0928803d3519946e5a2a4238a01f6cb
          (cd "$EVIDENCE_DIR"; find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed evidence without claiming full PR acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-twelfth-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-twelfth/
          retention-days: 14
          if-no-files-found: error

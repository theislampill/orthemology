name: issue-35-checkpoint-06-corrected

# Retry the exact reviewed checkpoint script at fbaf8a52. The only body repair
# removes its extra leading recovery-note newline. Expected tree, test commands,
# branch-only write scope and self-removal remain unchanged.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-checkpoint-06
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
      SCRIPT_COMMIT: fbaf8a5293f6b79a6e902300b8fad79cab97116f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install existing locked dependencies
        run: python -m pip install --quiet -r requirements-ci.lock.txt
      - name: Apply the byte-exact corrected checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue35-checkpoint06"
          printf 'EVIDENCE_DIR=%s/issue35-checkpoint06\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          ref = os.environ['SCRIPT_COMMIT']
          path = '.github/workflows/reader-refactor-snapshot.yml'
          body = subprocess.check_output(['git', 'show', ref + ':' + path])
          oid = subprocess.check_output(['git','hash-object','--stdin'],input=body).decode().strip()
          if oid != '90354de46239ead4df56610d72a0e9f1cefd8657':
              raise SystemExit('Reviewed checkpoint script identity mismatch')
          steps = yaml.safe_load(body)['jobs']['checkpoint']['steps']
          script = next(s['run'] for s in steps if s.get('name') == 'Apply the exact historical binding and reader gate')
          old = 'test "$(git rev-parse HEAD^)" = 052ac475fbc70cb6e4b9c22a68bf571df0720888'
          new = 'test "$(git rev-parse HEAD^)" = ' + ref
          if script.count(old) != 1 or script.count('p.write_text(p.read_text()+note)') != 1:
              raise SystemExit('Unexpected checkpoint preimage')
          script = script.replace(old, new).replace('p.write_text(p.read_text()+note)', 'p.write_text(p.read_text()+note.removeprefix("\\n"))')
          out = Path(os.environ['RUNNER_TEMP'])/'issue35-checkpoint06'
          (out/'transfer-correction.txt').write_text('Extra leading note LF removed; original expected tree and gates retained.\n')
          with (out/'apply.txt').open('w') as log:
              result = subprocess.run(['bash','-euo','pipefail','-c',script], stdout=log, stderr=subprocess.STDOUT)
          print((out/'apply.txt').read_text())
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          (out/'applied-tree.txt').write_text(tree+'\n')
          print('Observed applied tree:', tree)
          if result.returncode:
              raise SystemExit(result.returncode)
          if tree != '3bb5332ced161601ccad287c6959c4479634d7da':
              raise SystemExit('Tested tree differs')
          PY
      - name: Run the original qualification commands unchanged
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          body=subprocess.check_output(['git','show',os.environ['SCRIPT_COMMIT']+':.github/workflows/reader-refactor-snapshot.yml'])
          steps=yaml.safe_load(body)['jobs']['checkpoint']['steps']
          script=next(s['run'] for s in steps if s.get('name')=='Qualify the exact candidate without weakening any gate')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Publish the originally bounded exact-tree checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          body=subprocess.check_output(['git','show',os.environ['SCRIPT_COMMIT']+':.github/workflows/reader-refactor-snapshot.yml'])
          steps=yaml.safe_load(body)['jobs']['checkpoint']['steps']
          script=next(s['run'] for s in steps if s.get('name')=='Save the checked feature checkpoint')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Retain observed checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-checkpoint06-corrected-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-checkpoint06/
          retention-days: 14
          if-no-files-found: error

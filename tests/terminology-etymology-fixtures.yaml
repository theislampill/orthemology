      - BENCHMARK_GATE
  - document: terminology/orthemic-terminology-pilot-protocol.md
    start_marker: "<!-- TERMINOLOGY-PROVENANCE:START -->"
    end_marker: "<!-- TERMINOLOGY-PROVENANCE:END -->"
    required_assertion_ids:
      - CONSTRUCTED_GROUNDED
      - ORTH_SCOPE
      - EME_SCOPE
      - MA_MAT_SCOPE
      - EMA_RESONANCE
      - PRIOR_DIFFERENT_SENSE
      - NON_ADOPTION
      - BENCHMARK_GATE

required_source_rows:
  - {id: ETY-1, bibliography_key: merriamwebsterOrthCombiningForm}
  - {id: ETY-2, bibliography_key: merriamwebsterEmeSuffix}
  - {id: ETY-3, bibliography_key: smyth1920GreekGrammar}
  - {id: ETY-4, bibliography_key: lsjEmos}
  - {id: ETY-5A, bibliography_key: constable1999Ortheme}
  - {id: ETY-5B, bibliography_key: burridgeBlaxter2020LinguisticCopying}

required_document_assertions:

name: issue-35-curation-checkpoint-05

# One-shot, exact-tree checkpoint for the owner-authorised feature branch.
# The encoded patch contains only the five named documentation/generated files.
# This workflow removes itself; no merge, source rewrite or release is permitted.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-curation-checkpoint-05
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: refactor/issue-35-research-reader-20261012
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Install existing locked dependencies
        run: python -m pip install --quiet --disable-pip-version-check -r requirements-ci.lock.txt
      - name: Apply the exact locally tested documentation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 027be47c7426e1e52da640ac0066f85de4fe5892
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-curation05"
          printf 'EVIDENCE_DIR=%s/issue35-curation05\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, zlib
          data = '''(?)'''
          PY

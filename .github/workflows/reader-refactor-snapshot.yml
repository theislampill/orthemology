name: issue-35-resume-eighteenth
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact public Git history without credentials
        shell: bash
        run: |
          set -euo pipefail
          saved=34d90ac0c8fa5bee0ad2773df832da092b396259
          available=e9050c1213753a7fd272c4c2d1b8e5579f51ce70
          test "$(git rev-parse HEAD^)" = "$saved"
          test "$(git rev-parse "$saved^{tree}")" = 14169a4b6aa30c9a604ef81ec25834529c13f5c7
          git merge-base --is-ancestor "$available" "$saved"
          out="$RUNNER_TEMP/issue35-resume-eighteenth"
          mkdir -p "$out"
          git update-ref refs/recovery/issue35-resume-eighteenth HEAD
          git bundle create "$out/history.bundle" refs/recovery/issue35-resume-eighteenth "^$available"
          printf '%s\n' "$saved" > "$out/saved-head.txt"
          git rev-parse HEAD > "$out/transport-head.txt"
          git rev-parse 'HEAD^{tree}' > "$out/transport-tree.txt"
          git rev-parse origin/main > "$out/main-head.txt"
          (cd "$out"; sha256sum ./*.bundle ./*.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-resume-eighteenth-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-resume-eighteenth/
          retention-days: 14
          if-no-files-found: error

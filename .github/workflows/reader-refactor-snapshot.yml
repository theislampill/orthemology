name: issue-35-recovery-04-integrate

# One-shot feature-branch integration. No main write or scientific acceptance.
# Tested fixture/map postimages are checked before any commit. Removes itself.
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: issue-35-recovery-04-integrate
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'theislampill/orthemology' && github.ref == 'refs/heads/refactor/issue-35-research-reader-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: refactor/issue-35-research-reader-20261012
      MAIN: 0784acddd4770f1190f758f264ba52b2b110bd27
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - name: Guard the exact branch and prepare existing dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = eb9e3627a20106c30a16bb80b759f6174a2f8e81
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse "$MAIN^{tree}")" = 38b18f38db2e38dabe1ec391c07c0b0f2b20d574
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/issue35-run04"
          printf 'EVIDENCE=%s/issue35-run04\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --quiet --disable-pip-version-check -r requirements-ci.lock.txt
      - name: Merge only the exact already-published main into the feature branch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff "$MAIN" > "$EVIDENCE/main-merge.txt" 2>&1
          rc=$?
          set -e
          cat "$EVIDENCE/main-merge.txt"
          test "$rc" -le 1
          python - <<'PY'
          import subprocess
          conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines())
          expected = {'docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256'}
          if not conflicts <= expected:
              raise SystemExit('Unreviewed merge conflict: ' + repr(conflicts))
          PY
          git checkout "$MAIN" -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
      - name: Apply byte-checked fixture repair and refresh the bounded source population
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,sys
          sys.path.insert(0,'scripts')
          from reader_census import census
          from check_reader_pilot import entries_at,matches
          main='0784acddd4770f1190f758f264ba52b2b110bd27'
          p=Path('tests/test_reader_pilot.py')
          if subprocess.check_output(['git','hash-object',str(p)]).decode().strip() != '66db0d58d5840bddbb385772deb3ccca5790a9f7':
              raise SystemExit('Unexpected fixture-test preimage')
          s=p.read_text()
          block='''class ReaderFixtureReferenceTests(unittest.TestCase):
              def test_temporary_fixture_names_are_not_ghost_repository_citations(self):
                  import sys
                  sys.path.insert(0, str(ROOT / "scripts"))
                  import validate_internal_references as refs
                  owner = "tests/test_reader_pilot.py"
                  text = (ROOT / owner).read_text(encoding="utf-8")
                  missing = sorted({path for path, _ in refs._citation_occurrences(
                      owner, text, root=str(ROOT), successor_sources={})
                      if not refs._resolves(owner, path)})
                  self.assertEqual(missing, [], "Synthetic fixture paths must not claim live repository sources")


          '''
          # Strip the Python-source indentation carried by the YAML block.
          lines=block.splitlines(True)
          block=lines[0]+''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          s=s.replace('if __name__ == "__main__":',block+'if __name__ == "__main__":')
          s=s.replace('theory/','fixture-theory/').replace('"theory"','"fixture-theory"')
          s=s.replace('docs/profile.yaml','fixture-docs/profile.yaml').replace('docs/gallery.md','fixture-docs/gallery.md')
          s=s.replace('"include": ["docs/"]','"include": ["fixture-docs/"]').replace('"key": "docs"','"key": "fixture-docs"')
          s=s.replace('"""Mechanical reader-pilot controls; not a classifier of philosophical truth."""','''"""Mechanical reader-pilot controls; not a classifier of philosophical truth.

          Fixture-only scientific and profile paths use explicit fixture roots. They are
          created in temporary repositories, not citations to missing project documents.
          The real reader and generated-publication paths still exercise their actual
          production contracts; the repository reference gate is unchanged.
          """''')
          if hashlib.sha256(s.encode()).hexdigest() != '3633746076a039c74bbbd0b811d75e5ceb0a3375cee82655c371754af1ad44c3':
              raise SystemExit('Fixture repair differs from locally tested postimage')
          p.write_text(s)
          e=Path('docs/project-closure/reader-refactor-issue-35')
          old=json.loads((e/'CENSUS.json').read_text())
          paths=[x['path'] for x in old['owners']]+['research/source-fidelity/epistemic-tuples/README.md','research/source-fidelity/epistemic-tuples/FIDELITY.json']
          c=census(Path.cwd(),main,owners=paths)
          (e/'CENSUS.json').write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          m=json.loads((e/'OWNER-MAP.json').read_text());rows=entries_at(Path.cwd(),main)
          m['baseline']={'commit':main,'tree':subprocess.check_output(['git','rev-parse',main+'^{tree}']).decode().strip()}
          m['entries_sha256']=hashlib.sha256(json.dumps(rows,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          m['collections'].insert(18,{'key':'epistemic-tuples-source-fidelity','include':['research/source-fidelity/'],'exclude':[],'owners':['research/source-fidelity/epistemic-tuples/README.md','research/source-fidelity/epistemic-tuples/FIDELITY.json'],'candidate_paths':3,'candidate_role':'Reading transcription and diagram attached to the existing work; held PDF and separate ET05 scientific correction keep their own standing.'})
          for g in m['collections']:
              g['candidate_paths']=sum(matches(row['path'],g['include']) and not matches(row['path'],g['exclude']) for row in rows)
          m['baseline_change_note']='Recovery 04 includes merged PR 37. Prior census and owner map remain in exact pre-reconciliation Git history; this is not evidence of rereading unchanged scientific bodies.'
          (e/'OWNER-MAP.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          expected={'CENSUS.json':'65980c4d2dd19936212a03ed650d0cb69cf4147e72098607fac9dbce39eb8461','OWNER-MAP.json':'a0c321a3ac67db5d750517164885f32ac47df6f47a24befffc982ddcc9640cbd'}
          for name,digest in expected.items():
              if hashlib.sha256((e/name).read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Unexpected reconciled map: '+name)
          print('PASS: all tested fixture and population postimages match')
          PY
      - name: Retire transport, stage exact changes and regenerate existing outputs
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/reader-refactor-snapshot.yml
          git add -- tests/test_reader_pilot.py docs/project-closure/reader-refactor-issue-35/CENSUS.json docs/project-closure/reader-refactor-issue-35/OWNER-MAP.json
          python -B scripts/generate_current_state.py | tee "$EVIDENCE/generation.txt"
          python -B scripts/make_manifest.py | tee -a "$EVIDENCE/generation.txt"
          git add -- docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
      - name: Exercise actual bindings and existing integration gates
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/test_reader_census.py 2>&1 | tee "$EVIDENCE/census.txt"
          python -B tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE/pilot-normal.txt"
          python -B -O tests/test_reader_pilot.py 2>&1 | tee "$EVIDENCE/pilot-optimized.txt"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$EVIDENCE/reader.txt"
          python -B tests/test_epistemic_tuples_fidelity.py 2>&1 | tee "$EVIDENCE/fidelity.txt"
          python -B scripts/validate_repo.py 2>&1 | tee "$EVIDENCE/hygiene.txt"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$EVIDENCE/references.txt"
          python -B scripts/validate_review_state.py 2>&1 | tee "$EVIDENCE/review-state.txt"
          python -B scripts/validate_current_state.py 2>&1 | tee "$EVIDENCE/current-state.txt"
          python -B scripts/validate_state_convergence.py 2>&1 | tee "$EVIDENCE/convergence.txt"
      - name: Guard preservation, commit and push only this feature branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          main='0784acddd4770f1190f758f264ba52b2b110bd27'
          prefix='docs/project-closure/reader-refactor-issue-35/'
          allowed={prefix+n for n in ['CENSUS.json','OWNER-MAP.json','CROSSWALK.json','PILOT.md','PILOT-QUALIFICATION.md','EXECUTION.md','CONTINUATION.md','RECOVERY-04.md']}
          allowed|={'docs/reader/'+n for n in ['RESEARCH-ATLAS.md','PAPER-CATALOGUE.md','RESULT-INDEX.md','CURRENT-FRONTIERS.md','APPLICATIONS.md','VERIFICATION-GUIDE.md']}
          allowed|={'scripts/reader_census.py','scripts/check_reader_pilot.py','tests/test_reader_census.py','tests/test_reader_pilot.py','docs/current-state.yaml','docs/provenance/RELEASE-MANIFEST.sha256','docs/project-closure/HISTORICAL-STATUS-INDEX.yaml','.github/workflows/validate.yml'}
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only',main]).decode().splitlines())
          if not changed<=allowed: raise SystemExit('Unexpected source changes: '+repr(changed-allowed))
          if subprocess.check_output(['git','ls-files','--others','--exclude-standard']).strip(): raise SystemExit('Untracked output')
          before=yaml.safe_load(subprocess.check_output(['git','show',main+':docs/current-state.yaml']))['authored']
          if yaml.safe_load(Path('docs/current-state.yaml').read_text())['authored']!=before: raise SystemExit('Authored state changed')
          print('PASS: main scientific bodies and authored state preserved')
          PY
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'fix: recover reader checkpoint, repair fixture citations and reconcile main'
          python -B scripts/generate_current_state.py --check
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$EVIDENCE/head.txt"
          git rev-parse 'HEAD^{tree}' > "$EVIDENCE/tree.txt"
          git bundle create "$EVIDENCE/checkpoint.bundle" HEAD
          (cd "$EVIDENCE"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Preserve observed outputs; no whole-refactor acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue35-run04-checkpoint-${{ github.sha }}
          path: ${{ runner.temp }}/issue35-run04/
          retention-days: 14
          if-no-files-found: error

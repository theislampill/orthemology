  - id: speech_capacity
    domain: entities
    value_space: [has_capacity, lacks_capacity, unassigned]
    equality_criterion: Values agree exactly when the declared capacity valuation agrees.
    relevant_projections: [{id: entity_to_speech_capacity, domain: entities, codomain: speech_capacity, rule: Return the declared capacity valuation.}]
    forbidden_collapses: [speech_occurrence, name_authorization, revealed_content, divine_speech]
  - id: speech_occurrence
    domain: entity-time pairs
    value_space: finite speech-event tokens plus none
    equality_criterion: Values agree exactly when the declared speech-event token agrees.
    relevant_projections: [{id: entity_time_to_speech_occurrence, domain: entity-time pairs, codomain: speech_occurrence, rule: Return the declared speech event or none.}]
    forbidden_collapses: [speech_capacity, name_authorization, revealed_content]
  - id: name_authorization

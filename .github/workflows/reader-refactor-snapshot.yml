name: issue35 maintenance exercise qualification
on:
  push:
    branches: [refactor/issue-35-research-reader-20261012]
    paths: [.github/workflows/reader-refactor-snapshot.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'theislampill/orthemology'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
      - run: pip install --quiet -r requirements-ci.lock.txt
      - name: Apply exact maintenance candidate and remove transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7e7c147d4c55cf3ba07f3f7e0065fab2437c230f
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/reader-refactor-snapshot.yml
          mkdir -p "$RUNNER_TEMP/issue35-maintenance"
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-maintenance'
          sha = '00226f00f12199e7fea3599ed85c0f04e8d1d9b6'
          obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/theislampill/orthemology/git/blobs/' + sha]))
          blob = base64.b64decode(obj['content'])
          if hashlib.sha1(b'blob ' + str(len(blob)).encode() + b'\0' + blob).hexdigest() != sha:
              raise SystemExit('transport blob mismatch')
          raw = lzma.decompress(base64.b64decode(blob, validate=True))
          if hashlib.sha256(raw).hexdigest() != '3eaa1c13fd3b9a09c5ecee7a31be0d0a2715454a035d8402276c998f8be81fb5':
              raise SystemExit('payload mismatch')
          p = json.loads(raw)
          if p['base'] != '7e7c147d4c55cf3ba07f3f7e0065fab2437c230f':
              raise SystemExit('unexpected baseline')
          subprocess.run(['git', 'apply', '--check', '-'], input=p['patch'].encode(), check=True)
          subprocess.run(['git', 'apply', '-'], input=p['patch'].encode(), check=True)
          pathlib.Path('.github/workflows/reader-refactor-snapshot.yml').unlink()
          subprocess.run(['git', 'add', '-u'], check=True)
          for script in ['scripts/generate_current_state.py', 'scripts/make_manifest.py']:
              subprocess.run(['python', '-B', script], check=True)
          subprocess.run(['git', 'add', 'docs/current-state.yaml', 'docs/provenance/RELEASE-MANIFEST.sha256'], check=True)
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', p['base']], text=True).splitlines())
          if paths != set(p['sha256']):
              raise SystemExit('write-set mismatch')
          for rel, expected in p['sha256'].items():
              if hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest() != expected:
                  raise SystemExit('candidate byte mismatch: ' + rel)
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != p['tree']:
              raise SystemExit('candidate tree mismatch')
          (out / 'payload.json').write_bytes(raw)
          (out / 'candidate.patch').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary', p['base']]))
          (out / 'identity.json').write_text(json.dumps({'base': p['base'], 'tree': p['tree'], 'transport_head': os.environ['GITHUB_SHA'], 'scope': p['scope'], 'qualification': 'native changed-path maintenance qualification; full normal CI remains separate'}, indent=2) + '\n')
          print('Exact staged maintenance candidate:', p['tree'])
          PY
      - name: Execute all five real maintenance footprints in both modes
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-maintenance"
          python -B tests/test_reader_pilot.py MaintenanceFootprintTests 2>&1 | tee "$out/maintenance-normal.log"
          python -B -O tests/test_reader_pilot.py MaintenanceFootprintTests 2>&1 | tee "$out/maintenance-optimized.log"
          python -B tests/test_reader_census.py 2>&1 | tee "$out/census.log"
          python -B -O tests/test_reader_census.py 2>&1 | tee "$out/census-optimized.log"
          python - <<'PY'
          import json, os, pathlib, re
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-maintenance'
          for mode in ['normal', 'optimized']:
              text = (out / ('maintenance-' + mode + '.log')).read_text()
              rows = [json.JSONDecoder().raw_decode(text[m.end():])[0] for m in re.finditer('MAINTENANCE_RECEIPT ', text)]
              if len(rows) != 5 or {r['exercise'] for r in rows} != {'M01', 'M02', 'M03', 'M04', 'M05'} or any(r['outcome'] != 'PASS' for r in rows):
                  raise SystemExit('incomplete actual maintenance receipts')
              (out / ('maintenance-' + mode + '.json')).write_text(json.dumps(rows, indent=2) + '\n')
          PY
      - name: Original source preservation, projection, state and reference gates
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue35-maintenance"
          python -B scripts/check_reader_pilot.py 2>&1 | tee "$out/reader-check.log"
          python -B scripts/validate_t20_v6_projection.py 2>&1 | tee "$out/projection-check.log"
          python -B scripts/generate_current_state.py --check 2>&1 | tee "$out/drift.log"
          python -B scripts/validate_repo.py 2>&1 | tee "$out/hygiene.log"
          python -B scripts/validate_current_state.py 2>&1 | tee "$out/state.log"
          python -B scripts/validate_review_state.py 2>&1 | tee "$out/review.log"
          python -B scripts/validate_internal_references.py 2>&1 | tee "$out/references.log"
          before=$(git write-tree)
          python -B scripts/generate_current_state.py
          python -B scripts/make_manifest.py
          git add docs/current-state.yaml docs/provenance/RELEASE-MANIFEST.sha256
          test "$(git write-tree)" = "$before"
      - name: Export tested public objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue35-maintenance'
          p = json.loads((out / 'payload.json').read_bytes())
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != p['tree']:
              raise SystemExit('tested candidate changed')
          def api(endpoint, body):
              return json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/theislampill/orthemology' + endpoint, '--input', '-'], input=json.dumps(body).encode()))
          elements = []
          for rel in sorted(p['sha256']):
              data = pathlib.Path(rel).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})['sha'] != sha:
                  raise SystemExit('uploaded blob mismatch')
              elements.append({'path': rel, 'mode': '100644', 'type': 'blob', 'sha': sha})
          if api('/git/trees', {'base_tree': p['base_tree'], 'tree': elements})['sha'] != p['tree']:
              raise SystemExit('uploaded tree mismatch')
          (out / 'uploaded-tree.json').write_text(json.dumps({'tree': p['tree'], 'files': sorted(p['sha256']), 'remote_ref_moved': False}, indent=2) + '\n')
          (out / 'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest() + '  ' + f.name + '\n' for f in sorted(out.iterdir()) if f.is_file() and f.name != 'SHA256SUMS'))
          print('Exact tested public tree exported:', p['tree'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue35-maintenance-footprints
          path: ${{ runner.temp }}/issue35-maintenance/
          retention-days: 14
